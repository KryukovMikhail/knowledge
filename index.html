<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Страна знаний">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d5a7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Путешествие в страну знаний</title>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1a;--parch:#f6e7c6;--gold:#d9a234;--gold-d:#8a6214;--red:#a8322a;--green:#3f7d3a;--shadow:0 6px 18px rgba(0,0,0,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:'PT Sans',system-ui,sans-serif;font-size:16px}
body{background:#1d5a7a;transition:background .4s}
#app{max-width:620px;margin:0 auto;position:relative}
.screen{min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:'Philosopher',Georgia,serif;margin:0}
.top{display:flex;align-items:center;gap:8px}
.top .ttl{flex:1;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);line-height:1.1}
.top h1.ttl{font-size:27px;text-align:center}
.top h2.ttl{font-size:19px}
.btn{font:inherit;font-weight:700;border:none;border-radius:14px;padding:13px 20px;background:var(--gold);color:#2b1a08;box-shadow:0 4px 0 var(--gold-d),var(--shadow);cursor:pointer;font-size:17px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.green{background:#5fae55;color:#fff;box-shadow:0 4px 0 #2f6b29,var(--shadow)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;padding:9px 13px;font-size:15px}
.btn.ghost:active{transform:none;background:rgba(255,255,255,.28)}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.card{background:var(--parch);border-radius:16px;padding:16px;box-shadow:var(--shadow);border:2px solid #c09a58;position:relative}
.map{width:100%;height:auto;display:block;border-radius:18px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
svg text{font-family:'Philosopher',Georgia,serif}
.node{cursor:pointer}
.node:active{opacity:.8}
.locked{filter:grayscale(.75) brightness(.92)}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:.15;transform:scale(1.35)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.guide{display:flex;gap:10px;align-items:flex-end}
.owl{font-size:44px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));flex:none}
.bubble{background:#fffaf0;border-radius:16px 16px 16px 4px;padding:11px 14px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.35}
.foot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,20,10,.92);color:#fff;padding:11px 16px;border-radius:12px;z-index:50;max-width:90vw;text-align:center;animation:fade .25s;font-size:15px}
.overlay{position:fixed;inset:0;background:rgba(10,10,20,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:40;animation:fade .25s}
.overlay .card{max-width:440px;width:100%}
input.name{font:inherit;font-size:18px;width:100%;padding:12px;border-radius:12px;border:2px solid #c09a58;background:#fffaf0;margin:12px 0}
/* task */
.thead{display:flex;align-items:center;gap:8px;color:#fff}
.thead .tt{flex:1;font-family:'Philosopher',serif;font-size:18px;line-height:1.15;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.chip{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .4s}
.lesson h2{font-size:23px;margin-bottom:8px}
.lesson p{line-height:1.5;margin:8px 0;font-size:16.5px}
.lesson .scrollic{font-size:46px;text-align:center}
.lesson b{color:#7a3b10}
.qnum{font-size:13px;color:#8a6a3a;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.qtext{font-size:19px;font-weight:700;margin:8px 0 6px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:13px 14px;border-radius:13px;border:2px solid #c9a65a;background:#fffaf0;font:inherit;font-size:16.5px;color:var(--ink);cursor:pointer;transition:background .15s}
.opt:active{background:#f3e4bf}
.opt.ok{background:#cdeec2;border-color:var(--green)}
.opt.bad{background:#f6cbc5;border-color:var(--red)}
.opt.dim{opacity:.55}
.opts.tf{display:flex;gap:10px}
.opts.tf .opt{text-align:center;font-weight:700;font-size:18px}
.expl{margin-top:10px;padding:11px 13px;border-radius:12px;background:#fff3d6;border-left:5px solid var(--gold);line-height:1.4;animation:fade .3s}
.expl.good{border-color:var(--green);background:#eaf7e4}
.expl.wrong{border-color:var(--red);background:#fbe9e6}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--gold);text-align:center;color:var(--green)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* sort */
.sortcard{font-size:24px;font-weight:700;text-align:center;padding:22px 12px;background:#fffaf0;border:3px dashed #c09a58;border-radius:16px;margin:8px 0 14px;font-family:'Philosopher',serif}
.sortcard small{display:block;font-size:14px;font-weight:400;font-family:'PT Sans',sans-serif;color:#7a5a30;margin-top:4px}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bin{font:inherit;border:2px solid #b58b45;border-radius:14px;background:#efd9a8;padding:10px 6px;cursor:pointer;color:var(--ink);min-height:120px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bin:active{background:#e6cb8e}
.bin .bi{font-size:30px}
.bin .bn{font-weight:700;font-size:14px;line-height:1.1}
.bin .bl{font-size:12px;color:#5b4220;line-height:1.25;text-align:center}
.left{text-align:center;color:#7a5a30;font-size:14px;margin-top:10px}
/* match */
.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.term{font:inherit;font-weight:700;padding:11px 4px;border-radius:12px;border:2px solid #b58b45;background:#efd9a8;cursor:pointer;color:var(--ink);font-size:15.5px}
.def{font:inherit;display:block;width:100%;text-align:left;padding:11px 12px;margin:7px 0;border-radius:12px;border:2px solid #c9a65a;background:#fffaf0;cursor:pointer;color:var(--ink);font-size:15.5px;line-height:1.3}
.sel{outline:4px solid #4a90c8;outline-offset:1px}
.term.done,.def.done{background:#cdeec2;border-color:var(--green);pointer-events:none;opacity:.75}
.def.done::before{content:attr(data-t) ' — ';font-weight:700}
.flash{background:#f6cbc5!important;border-color:var(--red)!important}
/* order */
.ladder{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0}
.step{font:inherit;font-weight:700;font-size:16px;border-radius:10px;padding:11px 8px;border:2px dashed #b58b45;background:#fbf1da;color:#9b7b4b;cursor:pointer;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}
.step.full{border-style:solid;background:#efd9a8;color:var(--ink)}
.step.ok{background:#cdeec2;border-color:var(--green)}
.step.bad{background:#f6cbc5;border-color:var(--red)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px}
.pool .term{padding:10px 14px}
/* result */
.res{text-align:center}
.bigstars{font-size:52px;letter-spacing:6px;margin:10px 0}
.mark{display:inline-flex;align-items:center;gap:10px;margin:4px auto 2px;padding:5px 16px 5px 5px;border-radius:40px;background:#fffaf0;border:3px solid #c09a58;font-weight:700;font-size:18px}
.mark b{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:'Philosopher',serif;font-size:32px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.mark.mini{padding:0;border:0;background:none;margin:0;vertical-align:middle}.mark.mini b{width:24px;height:24px;font-size:15px;font-family:inherit}
.mark.g5{border-color:#2e8b3e;color:#2e8b3e}.mark.g5 b{background:#2e8b3e}.mark.g4{border-color:#3a7ac0;color:#3a7ac0}.mark.g4 b{background:#3a7ac0}
.mark.g3{border-color:#d8960e;color:#b07a08}.mark.g3 b{background:#e6a817}.mark.g2{border-color:#c0392b;color:#c0392b}.mark.g2 b{background:#c0392b}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
.gray{color:#c9b998}
.gold{color:#e6a817;text-shadow:0 2px 0 #9b6d0c}
.cert{background:radial-gradient(circle at 50% 30%,#fff6dc,#ead09a);border:6px double #9b6d2c;text-align:center;padding:24px 18px}
.cert h1{font-size:34px;color:#7a2a12}
.cert .who{font-family:'Philosopher',serif;font-size:28px;color:#3b2a1a;border-bottom:2px solid #9b6d2c;display:inline-block;padding:0 14px;margin:8px 0}
.seal{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d4473b,#8e1d14);color:#ffdca0;display:flex;align-items:center;justify-content:center;font-size:38px;margin:14px auto 0;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.confetti{position:fixed;top:-30px;font-size:22px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.small{font-size:13.5px}
.build{align-self:flex-start;margin-top:4px;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.03em;padding:6px 8px 2px 2px;user-select:none;-webkit-user-select:none;cursor:default}
.adm .card{padding:14px}
.adm h3{font-size:18px;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#fffaf0;border:1px solid #d9c08a;border-radius:12px;padding:10px}
.tile b{display:block;font-size:22px;font-family:'Philosopher',serif;color:#7a2a12}
.tile span{font-size:12.5px;color:#7a5a30}
.qrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:8px 0;font-size:14.5px}
.qrow .pb{grid-column:1/3;height:7px;background:#ead8b0;border-radius:6px;overflow:hidden}
.qrow .pb i{display:block;height:100%;background:#3f7d3a}
.lg{border-top:1px solid #e3d0a6;padding:9px 2px;cursor:pointer}
.lg:first-child{border-top:none}
.lg .l1{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.lg .l2{font-size:12.5px;color:#7a5a30;margin-top:2px}
.lg .errs{display:none;margin:6px 0 0;padding-left:18px;font-size:13px;color:#8a2a1a;line-height:1.35}
.lg.open .errs{display:block}
.weak{font-size:13.5px;line-height:1.35;margin:6px 0;padding:7px 9px;background:#fbe9e6;border-radius:9px;border-left:4px solid #a8322a}
.weak b{color:#a8322a}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;margin:6px 0}
.sw input{width:22px;height:22px}
select.name{font:inherit;padding:8px;border-radius:10px;border:2px solid #c09a58;background:#fffaf0;width:100%;margin-bottom:8px}
.pinbox{font-size:28px;letter-spacing:12px;text-align:center}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dchip{font:inherit;border:2px solid #c09a58;background:#fffaf0;border-radius:20px;padding:7px 12px;cursor:pointer;color:var(--ink);font-size:14.5px}
.dchip.on{background:#8a4ab0;border-color:#5a2a7a;color:#fff;font-weight:700}
.dscore{display:flex;justify-content:space-around;gap:8px;margin-top:10px;font-size:16px}.dscore b{color:#a8322a;font-size:20px}
.drow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;margin:5px 0;font-size:14.5px}
.drow.ok{background:#e1f3d8}.drow.bad{background:#f8dcd7}.drow b{color:#a8322a}
.dfinal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dfinal>div{background:#fffaf0;border:2px solid #d9c08a;border-radius:14px;padding:10px}
.dfinal>div.win{border-color:#e6a817;box-shadow:0 0 0 4px rgba(230,168,23,.35)}
.dfinal .big{font-family:'Philosopher',serif;font-size:36px;font-weight:700;color:#7a2a12}
.opt.sel{outline:4px solid #8a4ab0;outline-offset:1px}
.book h3{margin:2px 0 4px;font-size:17px;line-height:1.25}
.bk-top{display:flex;gap:14px;align-items:flex-start}
.cover{flex:0 0 78px;height:108px;border-radius:4px 8px 8px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px;box-shadow:inset 6px 0 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35);text-align:center}
.cv-ic{font-size:30px}.cv-t{font-family:'Philosopher',serif;font-weight:700;font-size:11.5px;line-height:1.1}.cv-c{font-size:10px;opacity:.85}
.bk-info{flex:1;min-width:0}.bk-subj{font-size:13px;font-weight:700;color:#a8322a;text-transform:uppercase;letter-spacing:.3px}
.bk-auth{margin:0 0 4px;font-weight:700}
.book details{margin:10px 0}.book summary{cursor:pointer;font-weight:700;color:#7a4a1a}
.bk-ch{margin:8px 0 0;padding-left:22px;line-height:1.4}.bk-ch li{margin:4px 0}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hub button{font:inherit;border:none;border-radius:14px;background:rgba(255,248,230,.95);color:var(--ink);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 3px 0 #8a6232,var(--shadow)}
.hub button:active{transform:translateY(2px)}
.hub span{font-size:26px;line-height:1}.hub em{font-style:normal;font-weight:700;font-size:14px;text-align:center;line-height:1.15}.hub b{font-size:12.5px;color:#a8322a}
.hero{font:inherit;display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:16px;background:var(--parch);padding:8px 14px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);border:2px solid #c09a58}
.hav{background:radial-gradient(circle,#fff6dc,#e8d4a0);border-radius:50%;width:76px;height:76px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.pbar{height:8px;background:#ead8b0;border-radius:6px;overflow:hidden;margin:5px 0 3px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#e6a817,#f2c94c)}
.ranks{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.rk{display:flex;justify-content:space-between;padding:7px 10px;border-radius:10px;background:#efe6d0;font-size:15px;color:#8a7a62}
.rk.got{background:#e9f6df;color:#2f5a2a}.rk.cur{outline:3px solid #e6a817;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cbtn{font:inherit;border:none;background:none;padding:0;cursor:pointer}
.pcard{background:linear-gradient(#fffaf0,#efdcae);border:2px solid #b58b45;border-radius:12px;padding:8px 5px;text-align:center;min-height:118px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 8px rgba(0,0,0,.3);color:var(--ink)}
.pcard .pi{font-size:34px;line-height:1.1}.pcard .pn{font-family:'Philosopher',serif;font-weight:700;font-size:14px;line-height:1.1}.pcard .py{font-size:11px;color:#7a5a30;line-height:1.15}
.pcard.locked{background:linear-gradient(#5a4a6a,#3a2e46);border-color:#7a6a8a;color:#cfc4dc}.pcard.locked .py{color:#b8acc8}
.pcard.gold{background:linear-gradient(#fff3c4,#e6c25a);border-color:#9b6d0c}
.pcard.big{min-height:0;padding:16px;gap:6px}.pcard.big .pi{font-size:64px}.pcard.big .pn{font-size:24px}.pcard.big .py{font-size:14px}.pcard.big .pf{font-size:16px;line-height:1.4;margin-top:4px}
.tl{position:relative;padding:6px 0 20px}
.tl:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#c9a65a;border-radius:2px}
.tl-cent{position:relative;text-align:center;margin:14px 0 8px}
.tl-cent{color:#2b1a08;font-family:'Philosopher',serif;font-weight:700}
.tl-cent:after{content:'';}
.tl-cent{background:#e6a817;display:table;margin:14px auto 8px;padding:3px 12px;border-radius:12px;position:relative;z-index:1}
.tl-row{position:relative;display:flex;margin:6px 0}
.tl-row.l{justify-content:flex-start}.tl-row.r{justify-content:flex-end}
.tl-dot{position:absolute;left:50%;top:14px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff6dc;border:3px solid #a8322a;z-index:1}
.tl-card{width:calc(50% - 16px);background:var(--parch);border-radius:10px;padding:7px 9px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.25}
.tl-card b{display:block;font-family:'Philosopher',serif;font-size:18px;color:#a8322a}
.tl-row.lk .tl-card{background:rgba(255,255,255,.12);color:#cdbfa8;box-shadow:none;border:1px dashed #8a7a62}.tl-row.lk .tl-card b{color:#cdbfa8}.tl-row.lk .tl-dot{border-color:#8a7a62;background:#4a3a2a}
.tl-mini{display:flex;flex-direction:column;gap:6px}
.tl-ev{background:#efd9a8;border-radius:10px;padding:8px 10px;font-size:15px}.tl-ev b{color:#a8322a;margin-right:6px}
.tgap{font:inherit;border:2px dashed #c09a58;background:#fffaf0;border-radius:10px;padding:6px;color:#7a5a30;cursor:pointer;font-size:14px}
.tgap.ok{background:#cdeec2;border:2px solid #3f7d3a;color:#2f5a2a;font-size:15px}.tgap.ok b{color:#a8322a;margin-right:6px}.tgap.bad{background:#f6cbc5;border-color:#a8322a}
.chip2{cursor:pointer;border-radius:6px;padding:1px 3px;background:rgba(201,166,90,.18);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.chip2.nope{background:#e9e2d2;color:#9a8a72}.chip2.fixd{background:#cdeec2}.chip2.fixd s{color:#a8322a}
.quote{font-family:'Philosopher',serif;font-style:italic;font-size:21px;display:block;background:#fff6dc;border-left:5px solid #c09a58;padding:8px 12px;border-radius:8px}
.opts.odd{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts.odd .opt{margin:0;text-align:center;font-weight:700}
@media print{@page{size:A4 portrait;margin:12mm}body{background:#fff!important}body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:20px}.cert h1{font-size:56px}.cert .who{font-size:40px}.noprint,.toast,.confetti,.build{display:none!important}}
.halo{paint-order:stroke;stroke:#f5e6c2;stroke-width:5px;stroke-linejoin:round}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.grade{font:inherit;position:relative;aspect-ratio:1;border:none;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#e9e2d2,#c9bfa8);color:#6b6253;box-shadow:0 5px 0 #8f8572,var(--shadow);filter:grayscale(.4)}
.grade:active{transform:translateY(3px);box-shadow:0 2px 0 #8f8572}
.grade .gn{font-family:'Philosopher',serif;font-size:46px;font-weight:700;line-height:1}

{ id:'s1', name:'Три сословия', place:'Деревня', i:'🏘️', x:95, y:612,
  lesson:`<p>В Средние века люди считали, что общество делится на <b>три сословия</b> — большие группы людей с разными правами и обязанностями.</p>
  <p>🙏 <b>Молящиеся</b> — духовенство: священники, монахи, епископы. Они молятся за всех людей.<br>⚔️ <b>Воюющие</b> — феодалы: король, герцоги, графы, бароны, рыцари. Они защищают страну.<br>🌾 <b>Трудящиеся</b> — крестьяне. Они кормят всех своим трудом.</p>
  <p>Обычно человек принадлежал к сословию <b>по рождению</b> — так же, как его родители.</p>`,

{ id:'s2', name:'Крестьянская община', place:'Поля', i:'🌾', x:300, y:545,
  lesson:`<p>Большинство жителей средневековой Европы были <b>крестьянами</b>. Многие из них жили на земле феодала и зависели от него.</p>
  <p>Хозяйство было <b>натуральным</b>: почти всё нужное крестьяне делали сами — выращивали хлеб, пряли, ткали, шили одежду, мастерили инструменты.</p>
  <p>Крестьяне одной деревни объединялись в <b>общину</b>. Землю пахали по системе <b>трёхполья</b>: одно поле засевали осенью (озимые), другое весной (яровые), а третье отдыхало — его оставляли под <b>пар</b>.</p>`,
  tasks:[{type:'quiz', questions:[
   {q:'Что такое натуральное хозяйство?',o:['Хозяйство, где почти всё нужное производят сами, а не покупают','Хозяйство, где всё выращенное продают на рынке','Хозяйство, где работают только летом','Хозяйство, которое принадлежит королю'],e:'При натуральном хозяйстве люди сами обеспечивают себя едой, одеждой и инструментами. Покупали лишь то, чего не могли сделать сами: соль, железо.'},
   {q:'Как называлось объединение крестьян одной деревни?',o:['Община','Цех','Гильдия','Орден'],e:'Крестьяне объединялись в общину. А цехи — это объединения ремесленников в городах, о них будет во второй части.'},
   {q:'При трёхполье пашню делили на три части. Что было с третьей частью?',o:['Её оставляли под пар — земля отдыхала','Там сажали лес','Там пасли королевских коней','Там строили дома'],e:'Озимые, яровые и пар каждый год менялись местами. Отдохнувшая земля давала лучший урожай.'},
   {q:'Что решала крестьянская община?',o:['Когда начинать полевые работы, как пользоваться лесом и пастбищами','Кого посвятить в рыцари','Кто станет королём','Кого назначить епископом'],e:'Община сообща распределяла участки, решала, когда пахать и сеять, как пользоваться лугами, лесом и водой.'},
   {q:'Почему крестьяне редко покупали вещи?',o:['Почти всё делали сами в своём хозяйстве','Рынков тогда совсем не было','Покупать запрещала церковь','Денег не существовало'],e:'Рынки и деньги были, но крестьянам они были мало нужны: хозяйство было натуральным.'}
  ]}]
},
{ id:'s3', name:'Словарь сеньора', place:'Дом старосты', i:'📜', x:100, y:470,
  lesson:`<p>Главным богатством в Средние века была <b>земля</b>. Король раздавал земли своим приближённым за службу, а те — своим людям.</p>
  <p>Тот, кто давал землю, назывался <b>сеньором</b> (господином), а тот, кто её получал и обязывался служить, — <b>вассалом</b>. Земельное владение, полученное за службу, — это <b>феод</b>.</p>
  <p>Крестьяне выполняли для феодала <b>повинности</b>: <b>барщину</b> и <b>оброк</b>, а церкви отдавали <b>десятину</b>.</p>`,
  tasks:[{type:'match', prompt:'Соедини слово с его значением: нажми на слово, потом на объяснение.', pairs:[
   ['Феод','Земельное владение, которое сеньор передавал вассалу за военную службу'],
   ['Сеньор','Господин, который даёт землю вассалу'],
   ['Вассал','Тот, кто получил землю и обязан служить сеньору'],
   ['Барщина','Работа крестьян на поле и в хозяйстве феодала'],
   ['Оброк','Часть урожая, продукты или деньги, которые крестьяне отдают феодалу'],
   ['Десятина','Десятая часть доходов в пользу церкви']
  ]}]
},
{ id:'s4', name:'Феодальная лестница', place:'Королевский шатёр', i:'👑', x:300, y:395,
  lesson:`<p>Отношения сеньоров и вассалов похожи на <b>лестницу</b>.</p>
  <p>На самом верху — <b>король</b>, главный сеньор страны. Ниже — <b>герцоги и графы</b>, вассалы короля. Ещё ниже — <b>бароны</b>, вассалы герцогов и графов. А на нижней ступени — <b>рыцари</b>: у них своих вассалов уже не было.</p>
  <p>Во Франции говорили: <b>«Вассал моего вассала — не мой вассал»</b>. Каждый служил только своему сеньору.</p>
  <p>Крестьяне в эту лестницу не входили — своим трудом они кормили всех её участников.</p>`,
  tasks:[
   {type:'order', prompt:'Построй феодальную лестницу сверху вниз. Нажимай на звания по порядку.', items:['👑 Король','Герцоги и графы','Бароны','Рыцари'], e:'Верно! Король — главный сеньор, а рыцари — нижняя ступень лестницы.'},
   {type:'quiz', questions:[
    {q:'Что значили слова «Вассал моего вассала — не мой вассал»?',o:['Сеньор не мог приказывать вассалам своих вассалов','Вассалы могли никому не служить','Рыцари были главнее короля','Все вассалы подчинялись только королю'],e:'Барон служил своему графу, а не королю. Поэтому король не мог напрямую приказать барону — власть короля была слабой.'},
    {q:'Кто НЕ входил в феодальную лестницу?',o:['Крестьяне','Бароны','Графы','Рыцари'],e:'Феодальная лестница — это только феодалы. Крестьяне трудились на их землях.'}
   ]}
  ]
},
{ id:'s5', name:'Замок феодала', place:'Стены замка', i:'🏰', x:100, y:322,
  lesson:`<p>Феодалы жили в <b>замках</b> — каменных крепостях. Замок строили на холме, скале или у реки — там, где его легче защищать.</p>
  <p>Замок окружали высокие стены с башнями и глубокий <b>ров</b> с водой. Через ров был перекинут <b>подъёмный мост</b>. Из узких щелей в стенах — <b>бойниц</b> — защитники стреляли из луков.</p>
  <p>Главная башня — <b>донжон</b> — была жилищем феодала и последним убежищем во время осады.</p>`,
  tasks:[{type:'quiz', questions:[
   {q:'Как называлась главная башня замка?',o:['Донжон','Минарет','Пагода','Колокольня'],e:'Донжон — самая высокая и прочная башня. В нём жил феодал, там хранили запасы и прятались при осаде.'},
   {q:'Зачем вокруг замка выкапывали ров с водой?',o:['Чтобы врагу было трудно подойти к стенам','Чтобы ловить рыбу к пиру','Чтобы поливать огород','Для купания рыцарей'],e:'Ров мешал врагам подтащить к стенам лестницы и тараны.'},
   {q:'Что делали с подъёмным мостом, когда подходил враг?',o:['Поднимали его, закрывая вход','Поджигали','Разбирали на дрова','Украшали флагами'],e:'Мост поднимали на цепях, и он закрывал ворота, как дверь.'},
   {q:'Где обычно строили замки?',o:['На холме, скале или у реки — где удобно обороняться','В низине среди болот','Посреди ровного поля','Внутри густого леса, подальше от дорог'],e:'С высоты было видно врага издалека, а штурмовать замок на скале очень трудно.'},
   {q:'Узкие щели в стенах, через которые стреляли из лука, — это…',o:['Бойницы','Витражи','Форточки','Арки'],e:'Бойницы делали узкими снаружи и широкими внутри: защитнику удобно стрелять, а попасть в него трудно.'}
  ]}]
},
{ id:'s6', name:'Посвящение в рыцари', place:'Турнирное поле', i:'🛡️', x:300, y:252,
  lesson:`<p>Рыцарем становились не сразу. Мальчика из знатной семьи лет в 7 отдавали <b>пажом</b> ко двору сеньора. Лет в 14 он становился <b>оруженосцем</b> и помогал рыцарю. А примерно в 21 год юношу <b>посвящали в рыцари</b>: вручали меч и шпоры, ударяли по плечу.</p>
  <p>Рыцарь — это <b>конный воин</b> в доспехах. Рыцари показывали ловкость на <b>турнирах</b> — военных состязаниях. У каждого рыцарского рода был свой <b>герб</b>.</p>
  <p>Рыцарь должен был следовать <b>кодексу чести</b>: быть верным сеньору, смелым и защищать слабых.</p>`,
  tasks:[{type:'tf', prompt:'Правда или ложь?', questions:[
   {q:'Обучение будущего рыцаря начиналось со службы пажом.',a:true,e:'Да, лет с 7 мальчик служил пажом, потом становился оруженосцем.'},
   {q:'Турнир — это соревнование крестьян в пахоте.',a:false,e:'Нет! Турнир — это военные состязания рыцарей.'},
   {q:'Оруженосец помогал рыцарю: чистил доспехи и ухаживал за конём.',a:true,e:'Верно, а ещё подавал оружие и сопровождал рыцаря в походах.'},
   {q:'Рыцари сражались в основном пешими, без коней.',a:false,e:'Нет, рыцарь — это прежде всего конный воин в тяжёлых доспехах.'},
   {q:'Герб — отличительный знак рыцарского рода, его изображали на щите.',a:true,e:'Да! По гербу на щите узнавали рыцаря, когда лицо было закрыто шлемом.'},
   {q:'Рыцари платили оброк крестьянам.',a:false,e:'Наоборот: оброк платили крестьяне своему феодалу.'},
   {q:'По кодексу чести рыцарь должен был быть верным сеньору и защищать слабых.',a:true,e:'Верно, а ещё быть смелым, щедрым и держать слово.'}
  ]}]
},
{ id:'s7', name:'Свиток мудреца', place:'Донжон', i:'📖', x:200, y:128,
  lesson:`<p>Ты почти у цели! В донжоне тебя ждёт <b>Свиток мудреца</b>. В нём пропущены слова — вспомни всё, что узнал, и заполни пропуски.</p>

   {q:'Земельное владение, полученное за службу, называлось ___.',o:['феод','оброк','община'],e:'Феод получал вассал от своего сеньора.'},
   {q:'«Вассал моего вассала — не мой ___».',o:['вассал','сеньор','рыцарь'],e:'Каждый служил только своему сеньору.'},

   {q:'Хозяйство, где всё нужное производят сами, называется ___.',o:['натуральным','рыночным','королевским'],e:'Так жило большинство крестьян.'},
   {q:'Объединение крестьян одной деревни — это ___.',o:['община','цех','турнир'],e:'Община сообща решала деревенские дела.'}

{ id:'a1', name:'Великая степь', place:'§ 15', i:'🐎', x:115, y:165,
  lesson:`<p><b>Великая степь</b> — огромная равнина от Дуная до Китая. Там жили <b>кочевники</b> — скотоводы. Они перегоняли стада с пастбища на пастбище и жили в разборных войлочных домах — <b>юртах</b>.</p>
  <p>В VI веке тюрки создали <b>Тюркский каганат</b> во главе с <b>каганом</b>. Позже на юге Руси кочевали печенеги, а затем половцы.</p>
  <p>В <b>1206 году</b> на <b>курултае</b> — съезде монгольской знати — вождь <b>Темучин</b> был провозглашён <b>Чингисханом</b>. Его войско делилось на десятки, сотни, тысячи и <b>тумены</b> (по 10 000 воинов). Монголы завоевали Северный Китай, Среднюю Азию, Иран.</p>

{ id:'a2', name:'Китай', place:'§ 16', i:'🏯', x:285, y:375,
  lesson:`<p><b>Китай</b> — одна из древнейших стран мира. Её правитель — <b>император</b>, «Сын Неба». В Средние века Китай особенно процветал при династиях <b>Тан</b> (VII–X вв.) и <b>Сун</b> (X–XIII вв.).</p>
  <p>Чиновниками в Китае становились не по знатности, а сдав трудные <b>экзамены</b>. По <b>Великому шёлковому пути</b> караваны везли в другие страны шёлк, чай и фарфор.</p>
  <p>Китайцы изобрели <b>бумагу</b>, <b>книгопечатание</b>, <b>порох</b>, <b>компас</b>, <b>фарфор</b> и первыми стали пользоваться <b>бумажными деньгами</b>.</p>
  <p>В XIII веке Китай захватили монголы, внук Чингисхана <b>Хубилай</b> основал династию <b>Юань</b>. В 1368 году монголов изгнали, и к власти пришла династия <b>Мин</b>. При Мин в Пекине построили дворец <b>Запретный город</b>, а <b>Великая Китайская стена</b> получила свой нынешний вид.</p>`,
  tasks:[{type:'tf', prompt:'Правда или ложь?', questions:[
   {q:'Правителя Китая называли «Сыном Неба».',a:true,e:'Да, считалось, что император правит по воле Неба.'},
   {q:'В Китае чиновниками становились только по рождению, без всяких экзаменов.',a:false,e:'Нет! Чтобы стать чиновником, нужно было сдать трудные экзамены.'},
   {q:'Порох, компас и книгопечатание изобрели в Китае.',a:true,e:'Верно, как и бумагу, фарфор и бумажные деньги.'},
   {q:'По Великому шёлковому пути из Китая везли шёлк, чай и фарфор.',a:true,e:'Да, этот путь связывал Китай со Средней Азией, Ираном и Европой.'},
   {q:'Династию Юань основали японские самураи.',a:false,e:'Нет, её основал монгольский хан Хубилай — внук Чингисхана.'},
   {q:'Монголов из Китая изгнали, и к власти пришла династия Мин.',a:true,e:'Верно, это случилось в 1368 году.'},
   {q:'Запретный город — это китайская деревня, куда запрещали заходить крестьянам.',a:false,e:'Нет, это императорский дворец в Пекине, построенный при династии Мин.'}
  ]}]
},
{ id:'a3', name:'Страна восходящего солнца', place:'§ 17', i:'🗾', x:115, y:590,
  lesson:`<p><b>Япония</b> расположена на островах в Тихом океане. Её называют «Страной восходящего солнца».</p>
  <p>Японцы верили, что их <b>император</b> — потомок богини солнца. Но с <b>1192 года</b> реальная власть перешла к военному правителю — <b>сёгуну</b>.</p>
  <p>Воинов-всадников в Японии называли <b>самураями</b>. Они следовали кодексу чести <b>бусидо</b> — «путь воина»: верность господину, смелость, презрение к смерти. Главное оружие самурая — меч <b>катана</b>.</p>
  <p>В XIII веке монголы дважды пытались захватить Японию, но их флот разбили сильные бури. Японцы назвали их <b>камикадзе</b> — «божественный ветер».</p>
  <p>Японцы почитали духов природы — это религия <b>синто</b>, а также исповедовали <b>буддизм</b>. Они сочиняли короткие стихи-трёхстишия, позже названные <b>хокку</b>.</p>`,
  tasks:[
   {type:'match', prompt:'Соедини японское слово с его значением.', pairs:[
    ['Сёгун','Военный правитель, у которого была реальная власть'],
    ['Самурай','Японский воин'],
    ['Бусидо','Кодекс чести самурая — «путь воина»'],
    ['Катана','Меч самурая'],
    ['Камикадзе','«Божественный ветер», разбивший флот монголов'],
    ['Синто','Японская религия почитания духов природы']
   ]},
   {type:'quiz', questions:[
    {q:'С какого года реальная власть в Японии перешла к сёгуну?',o:['1192','1206','1368','1054'],e:'В 1192 году Минамото Ёритомо получил титул сёгуна, и власть оказалась у военных правителей.'},
    {q:'Чем самурай похож на европейского рыцаря?',o:['Он воин, служит господину и следует кодексу чести','Он пашет землю и платит оброк','Он монах и живёт в монастыре','Он купец и торгует шёлком'],e:'И рыцарь, и самурай — воины-вассалы, верные своему господину и правилам чести.'}
   ]}
  ]
},
{ id:'a4', name:'Индия', place:'§ 18', i:'🐘', x:285, y:810,
  lesson:`<p>Средневековая <b>Индия</b> была разделена на множество княжеств. Ими правили <b>раджи</b>.</p>
  <p>Общество Индии делилось на четыре <b>варны</b>: <b>брахманы</b> (жрецы), <b>кшатрии</b> (воины), <b>вайшьи</b> (земледельцы, торговцы, ремесленники) и <b>шудры</b> (слуги). Варны делились на множество <b>каст</b>. Человек всю жизнь оставался в касте, где родился.</p>
  <p>Главная религия — <b>индуизм</b>, индийцы почитали богов Брахму, Вишну и Шиву. В XIII веке на севере возник <b>Делийский султанат</b> — государство мусульман. В 1398 году Дели разорил завоеватель <b>Тимур</b>.</p>
  <p>Индийские учёные придумали <b>цифры</b>, которыми мы пишем (в Европе их называют арабскими), и знак <b>ноль</b>. Из Индии пришли и <b>шахматы</b>.</p>`,
  tasks:[
   {type:'order', prompt:'Расставь варны Индии от самой высшей к самой низшей.', items:['Брахманы (жрецы)','Кшатрии (воины)','Вайшьи (земледельцы, торговцы)','Шудры (слуги)'], e:'Верно! Выше всех были брахманы-жрецы, ниже всех — шудры.'},
   {type:'quiz', questions:[
    {q:'Как назывались правители индийских княжеств?',o:['Раджи','Сёгуны','Ханы','Фараоны'],e:'Раджа — правитель княжества в Индии.'},
    {q:'Какое государство мусульмане создали на севере Индии в XIII веке?',o:['Делийский султанат','Золотую Орду','Арабский халифат','Империю Мин'],e:'Делийский султанат возник в начале XIII века со столицей в городе Дели.'},
    {q:'Что из этого придумали индийские учёные?',o:['Ноль и цифры, которыми мы пишем','Порох и компас','Пирамиды и мумии','Узелковое письмо кипу'],e:'Порох и компас — китайские изобретения, а кипу — инкское. Индийцы придумали цифры и ноль, а ещё шахматы.'}
   ]}
  ]
},
{ id:'a5', name:'Золото Африки', place:'§ 19', i:'🐪', x:115, y:1030,
  lesson:`<p><b>Африку</b> пересекает огромная пустыня <b>Сахара</b>. В Северную Африку пришли арабы, и там распространился <b>ислам</b>.</p>
  <p>В Западной Африке было много <b>золота</b>, но не хватало <b>соли</b>. Купцы на <b>верблюдах</b> везли соль через Сахару и меняли её на золото. Здесь возникли богатые государства <b>Гана</b> и <b>Мали</b>.</p>
  <p>Правитель Мали <b>Манса Муса</b> в XIV веке совершил паломничество в Мекку и раздал по пути так много золота, что оно подешевело! Город <b>Тимбукту</b> был центром торговли и учёности.</p>
  <p>На востоке, в <b>Эфиопии</b>, правили христианские цари. В городе <b>Лалибела</b> церкви целиком вырубили в скале. На восточном побережье торговые города вели торговлю через Индийский океан, а на юге сохранились каменные стены <b>Великого Зимбабве</b>.</p>`,
  tasks:[{type:'tf', prompt:'Правда или ложь?', questions:[
   {q:'Через пустыню Сахару товары возили на верблюдах.',a:true,e:'Да, верблюд может долго идти без воды — «корабль пустыни».'},
   {q:'В Западной Африке соль меняли на золото.',a:true,e:'Верно! Соли там не хватало, а золота было много.'},
   {q:'Манса Муса — правитель государства Мали.',a:true,e:'Да, его считают одним из самых богатых людей в истории.'},
   {q:'В Эфиопии большинство жителей были язычниками-кочевниками, а христианства там не знали.',a:false,e:'Нет, Эфиопия — древнее христианское царство.'},
   {q:'Тимбукту — город, известный торговлей и учёными.',a:true,e:'Да, там были мечети, школы и большие собрания книг.'},
   {q:'Церкви Лалибелы построили из бамбука.',a:false,e:'Нет, их целиком вырубили в скале.'}
  ]}]
},
{ id:'a6', name:'Майя, ацтеки и инки', place:'§ 20', i:'🗿', x:285, y:1255,
  lesson:`<p>До прихода европейцев в Америке существовали удивительные цивилизации. Их называют <b>доколумбовыми</b> — то есть существовавшими до Колумба.</p>
  <p>🌴 <b>Майя</b> жили на полуострове <b>Юкатан</b>. Они строили города со ступенчатыми пирамидами-храмами (<b>Чичен-Ица</b>, <b>Тикаль</b>), создали письменность, точный календарь и знали ноль.</p>
  <p>🦅 <b>Ацтеки</b> построили столицу <b>Теночтитлан</b> на острове в озере <b>Тескоко</b> (сейчас там Мехико). Они устраивали плавучие огороды — <b>чинампы</b>. Самый известный их правитель — <b>Монтесума</b>.</p>
  <p>🏔️ <b>Инки</b> создали огромное государство в горах <b>Анды</b> со столицей <b>Куско</b>. Правителя называли <b>Сапа Инка</b> — «единственный Инка». Записи вели узелками на шнурах — <b>кипу</b>. Высоко в горах стоит их город <b>Мачу-Пикчу</b>.</p>
  <p>Индейцы Америки выращивали <b>кукурузу</b>, <b>картофель</b>, <b>помидоры</b> и <b>какао</b>, но не знали железа и не имели лошадей.</p>`,
  tasks:[{type:'sort', prompt:'Что к какой цивилизации относится? Нажми на нужную корзину.', done:'Все находки разложены по цивилизациям!',
    bins:[{n:'Майя',i:'🌴'},{n:'Ацтеки',i:'🦅'},{n:'Инки',i:'🏔️'}],
    items:[['Полуостров Юкатан',0],['Теночтитлан',1],['Куско',2],['Чичен-Ица',0],['Чинампы',1,'плавучие огороды'],['Кипу',2,'узелковое письмо'],['Тикаль',0],['Озеро Тескоко',1],['Мачу-Пикчу',2],['Монтесума',1],['Сапа Инка',2],['Горы Анды',2]]}]
},

{ id:'v1', name:'Столетняя война', place:'§ 21–22', i:'🏹', x:115, y:165,
  lesson:`<p>В <b>1337 году</b> английский король <b>Эдуард III</b> заявил права на французский трон. Так началась <b>Столетняя война</b> между Англией и Францией. На самом деле она длилась даже больше ста лет — до <b>1453 года</b>.</p>
  <p>Сначала побеждали англичане: их <b>лучники</b> с длинными луками разбили французских рыцарей при <b>Креси</b> (1346), <b>Пуатье</b> (1356) и <b>Азенкуре</b> (1415). Англичане захватили почти весь север Франции.</p>
  <p>Спасла Францию простая крестьянская девушка <b>Жанна д’Арк</b>. В <b>1429 году</b> она освободила осаждённый <b>Орлеан</b> — её прозвали <b>Орлеанской девой</b>. Потом Жанна привела дофина <b>Карла VII</b> в <b>Реймс</b>, где его короновали.</p>
  <p>В 1430 году Жанну взяли в плен, и в <b>1431 году</b> англичане сожгли её в Руане. Но французы продолжили борьбу и выгнали англичан. У Англии остался лишь порт <b>Кале</b>.</p>`,

{ id:'v2', name:'Чума и восстания', place:'§ 21–22', i:'💀', x:285, y:395,
  lesson:`<p>В <b>1347 году</b> в Европу с кораблями пришла страшная болезнь — <b>чума</b>. Её назвали <b>«Чёрной смертью»</b>. За несколько лет она унесла жизни примерно <b>трети</b> жителей Европы.</p>
  <p>Работников стало мало, а феодалы требовали всё больше. Крестьяне поднимались на восстания. Во Франции в <b>1358 году</b> вспыхнула <b>Жакерия</b> — от прозвища крестьян «Жак-простак».</p>
  <p>В Англии в <b>1381 году</b> восстание возглавил кровельщик <b>Уот Тайлер</b>. Проповедник <b>Джон Болл</b> спрашивал: «Когда Адам пахал, а Ева пряла, кто тогда был дворянином?»</p>
  <p>В Чехии проповедник <b>Ян Гус</b> критиковал богатство церкви. В <b>1415 году</b> его сожгли, и чехи поднялись на борьбу — начались <b>гуситские войны</b>. Их войском командовал <b>Ян Жижка</b>.</p>
  <p>В самой Англии после Столетней войны знать сражалась за трон в <b>Войне Алой и Белой розы</b> (1455–1485).</p>`,
  tasks:[{type:'match', prompt:'Соедини имя или название с объяснением.', pairs:[

{ id:'v3', name:'Падение Константинополя', place:'§ 23', i:'🕌', x:115, y:625,
  lesson:`<p>На рубеже XIII–XIV веков в Малой Азии возникло государство турок-османов. Его основатель — <b>Осман</b>, отсюда название — <b>Османская империя</b>.</p>
  <p>Сильнейшей частью османского войска были <b>янычары</b> — пехотинцы, которых с детства готовили к войне. Османы захватили Балканы. В <b>1389 году</b> они разбили сербов на <b>Косовом поле</b>.</p>
  <p>От некогда великой <b>Византии</b> остался почти только <b>Константинополь</b>. Византийцы просили помощи у Запада, но её почти не было.</p>
  <p>В <b>1453 году</b> султан <b>Мехмед II</b> с огромными пушками осадил и взял Константинополь. Последний император <b>Константин XI</b> погиб в бою. Город стал столицей османов — <b>Стамбулом</b>, а храм <b>Святой Софии</b> превратили в мечеть.</p>`,
  tasks:[{type:'tf', prompt:'Правда или ложь?', questions:[
   {q:'Османская империя получила название по имени своего основателя Османа.',a:true,e:'Да, турок-османов назвали по имени их первого правителя.'},
   {q:'Янычары — это византийские монахи.',a:false,e:'Нет, янычары — отборная османская пехота.'},
   {q:'В 1389 году на Косовом поле османы разбили сербов.',a:true,e:'Верно, после этого Сербия попала в зависимость от османов.'},
   {q:'Константинополь пал в 1453 году.',a:true,e:'Да, этим годом историки часто отмечают конец Средних веков.'},
   {q:'Константинополь взял султан Мехмед II.',a:true,e:'Верно, его прозвали Завоевателем.'},

{ id:'v4', name:'Возрождение', place:'§ 24', i:'🎨', x:285, y:855,
  lesson:`<p>В XIV–XV веках в Италии начинается эпоха <b>Возрождения</b> (Ренессанса). Люди снова увлеклись наукой и искусством Древней Греции и Рима — как будто «возрождали» их.</p>
  <p>Учёных той эпохи называли <b>гуманистами</b> (от латинского «человечный»): они верили в силу человеческого ума и таланта. Одним из первых гуманистов был поэт <b>Франческо Петрарка</b>.</p>
  <p>Великие художники Возрождения: <b>Леонардо да Винчи</b> («Мона Лиза»), <b>Микеланджело</b> (статуя Давида, роспись Сикстинской капеллы), <b>Рафаэль</b> («Сикстинская мадонна»).</p>
  <p>Около <b>1450 года</b> немец <b>Иоганн Гутенберг</b> изобрёл в Европе <b>книгопечатание</b>: книги стали дешевле и доступнее.</p>
  <p>В <b>1492 году</b> <b>Христофор Колумб</b> доплыл до Америки, а в 1498 году <b>Васко да Гама</b> открыл морской путь в Индию. Начинается Новое время!</p>`,

  lesson:`<p>В IV–VI веках начинается <b>Великое переселение народов</b>. Германские племена — готы, вандалы, франки, англы и саксы — и кочевники-гунны двинулись на земли Римской империи. Римляне называли чужеземцев <b>варварами</b>.</p>

{ id:'e2', name:'Византия', place:'§ 2', i:'👑',
  lesson:`<p>Восточная Римская империя пережила Западную почти на тысячу лет. Её называют <b>Византией</b>. Столица — <b>Константинополь</b>, его основал император <b>Константин</b> в <b>330 году</b>.</p>
  <p>Императора Византии называли <b>василевсом</b>. Самый знаменитый — <b>Юстиниан</b> (527–565). Он отвоевал Италию и Северную Африку, велел собрать все римские законы в один свод — <b>Кодекс Юстиниана</b> — и построил огромный храм <b>Святой Софии</b>.</p>
  <p>Византийцы украшали храмы <b>мозаиками</b> из кусочков цветного стекла и <b>иконами</b>. Соседями Византии были славяне, болгары, арабы.</p>
  <p>Братья <b>Кирилл и Мефодий</b> в IX веке создали <b>славянскую азбуку</b>. Из Византии в 988 году христианство пришло на Русь.</p>`,

{ id:'e3', name:'Королевство франков', place:'§ 3', i:'⚜️',
  lesson:`<p>В конце V века вождь франков <b>Хлодвиг</b> из рода <b>Меровингов</b> создал королевство на землях Галлии и принял <b>христианство</b> вместе со своей дружиной.</p>
  <p>Позже реальная власть перешла к управляющим королевским двором — <b>майордомам</b>. Майордом <b>Карл Мартелл</b> в <b>732 году</b> разбил арабов при <b>Пуатье</b>.</p>
  <p>Его сын <b>Пипин Короткий</b> в 751 году стал королём — так появилась династия <b>Каролингов</b>. Пипин подарил папе римскому земли в Италии — возникла <b>Папская область</b>.</p>

  lesson:`<p><b>Аравийский полуостров</b> — край пустынь и редких <b>оазисов</b>. Большинство арабов были <b>бедуинами</b> — кочевниками. Они разводили верблюдов и овец. В оазисах жили земледельцы, выращивавшие <b>финиковые пальмы</b>.</p>

{ id:'r2', name:'Пророк и Коран', place:'§ 5', i:'📗',
  lesson:`<p>Около <b>570 года</b> в Мекке родился <b>Мухаммад</b>. Около 610 года он начал проповедовать новую веру — <b>ислам</b> («покорность» единому Богу — <b>Аллаху</b>). Последователей ислама называют <b>мусульманами</b>.</p>
  <p>Знать Мекки преследовала Мухаммада, и в <b>622 году</b> он переселился в город Медину. Это переселение — <b>хиджра</b>. С него мусульмане ведут своё летоисчисление.</p>
  <p>В 630 году Мухаммад вернулся в Мекку, а вскоре почти вся Аравия приняла ислам. Священная книга мусульман — <b>Коран</b>. Молятся в <b>мечетях</b>.</p>
  <p>Главные обязанности мусульманина: вера в единого Бога, молитва пять раз в день, пост в месяц <b>Рамадан</b>, помощь бедным и паломничество в Мекку — <b>хадж</b>.</p>`,

{ id:'r3', name:'Арабский халифат', place:'§ 6', i:'🌙',
  lesson:`<p>После смерти Мухаммада в <b>632 году</b> мусульман возглавили <b>халифы</b> — «заместители» пророка. Их государство называют <b>Арабским халифатом</b>.</p>
  <p>Арабы завоевали Сирию, Палестину, Египет, Иран, Северную Африку, а в <b>711 году</b> — почти всю Испанию. В 732 году франки остановили их при Пуатье.</p>
  <p>Сначала правила династия <b>Омейядов</b> со столицей в <b>Дамаске</b>. В 750 году власть захватили <b>Аббасиды</b>, они построили новую столицу — <b>Багдад</b> (762 год). Особенно знаменит халиф <b>Харун ар-Рашид</b>, герой сказок.</p>
  <p>Огромный халифат было трудно удержать. В X веке он распался: в Испании возник свой <b>Кордовский халифат</b>, в Египте — свой.</p>`,

   {type:'quiz', questions:[

{ id:'r4', name:'Дом мудрости', place:'§ 6', i:'🔭',
  lesson:`<p>В Багдаде халифы создали <b>«Дом мудрости»</b> — библиотеку, где учёные переводили на арабский книги греков, персов и индийцев.</p>
  <p>Математик <b>аль-Хорезми</b> написал книгу, от названия которой произошло слово <b>«алгебра»</b>. Арабы переняли у индийцев цифры и ноль — в Европе их стали называть <b>арабскими</b>.</p>
  <p>Знаменитый врач <b>Ибн Сина</b> (в Европе — Авиценна) написал «Канон врачебной науки», по которому врачи учились сотни лет.</p>

   {q:'Кто такой Ибн Сина (Авиценна)?',o:['Знаменитый врач и учёный','Халиф из Багдада','Полководец','Сказочный герой'],e:'Его «Канон врачебной науки» изучали в Европе сотни лет.'},

{ id:'c3', name:'Рождение городов', place:'§ 9', i:'🏘️',
  lesson:`<p>С XI века в Европе стали быстро расти <b>города</b>. Ремесленники уходили из деревень и селились там, где удобно торговать: у стен замков и монастырей, у мостов, перекрёстков дорог и морских гаваней.</p>

function mapGeo(id){
 const M=MAPS[id],W=400,sx=W/(M.lon1-M.lon0),sy=sx*M.ky,H=Math.round((M.lat1-M.lat0)*sy);
 const P=(lon,lat)=>[(lon-M.lon0)*sx,(M.lat1-lat)*sy];
 const poly=a=>{const p=[];for(let i=0;i<a.length;i+=2)p.push(P(a[i],a[i+1]));return smoothClosed(p)};
 const sea='#a9d3e6',land='#f1e2bd',shore='#b99a62';
 let g=`<rect width="${W}" height="${H}" fill="${M.base==='land'?land:sea}"/>`;
 (M.land||[]).forEach(a=>g+=`<path d="${poly(a)}" fill="${land}" stroke="${shore}" stroke-width="1"/>`);
 (M.water||[]).forEach(a=>g+=`<path d="${poly(a)}" fill="${sea}" stroke="${shore}" stroke-width="1"/>`);
 (M.islands||[]).forEach(a=>g+=`<path d="${poly(a)}" fill="${land}" stroke="${shore}" stroke-width="1"/>`);
 (M.rivers||[]).forEach(a=>{const p=[];for(let i=0;i<a.length;i+=2)p.push(P(a[i],a[i+1]));g+=`<path d="${smoothOpen(p)}" fill="none" stroke="${sea}" stroke-width="2.6" stroke-linecap="round"/>`});
 for(let i=1;i<6;i++)g+=`<path d="M0,${H*i/6} H${W}" stroke="#7aa6bb" stroke-width=".4" opacity=".35" stroke-dasharray="3 4"/>`;
 for(let i=1;i<8;i++)g+=`<path d="M${W*i/8},0 V${H}" stroke="#7aa6bb" stroke-width=".4" opacity=".35" stroke-dasharray="3 4"/>`;
 return {W,H,P,g};
}

{id:'q1',name:'Восточные славяне',place:'§ 1–3',i:'🌲',
 lesson:`<p>Во время <b>Великого переселения народов</b> славяне расселились по Восточной Европе. Они делились на <b>западных</b>, <b>южных</b> и <b>восточных</b>. Восточные славяне — предки русских, украинцев и белорусов.</p>

{id:'q18',name:'Возвышение Москвы',place:'§ 30–31',i:'🏛️',
 lesson:`<p>Первым московским князем стал младший сын Александра Невского — <b>Даниил</b>. Главным соперником Москвы была <b>Тверь</b>.</p>
 <p>При князе <b>Иване Калите</b> (1325–1340) Москва возвысилась. Он получил ярлык на великое княжение и право собирать дань для Орды со всех русских земель. Часть денег оставалась в Москве — на них Иван выкупал земли. «<b>Калита</b>» — значит кошель для денег.</p>
 <p>В Москву переехал глава русской церкви — <b>митрополит Пётр</b>. Москва стала церковным центром Руси.</p>
 <p>Почти 40 лет при Калите и его сыновьях на Руси не было ордынских набегов — летопись называет это время <b>«великой тишиной»</b>.</p>`,

  {q:'Какой город был главным соперником Москвы?',o:['Тверь','Новгород','Псков','Рязань'],e:'Москва и Тверь боролись за ярлык.'},

{id:'q19',name:'Куликовская битва',place:'§ 32–33',i:'⚔️',
 lesson:`<p>Внук Ивана Калиты, князь <b>Дмитрий Иванович</b>, построил в Москве <b>белокаменный Кремль</b>. В 1378 году он разбил ордынцев на реке <b>Воже</b>.</p>

{id:'q22',name:'Иван III',place:'§ 36–37',i:'🦅',

{id:'h1',name:'Вода на Земле',place:'Гидросфера',i:'💧',
 lesson:`<p><b>Гидросфера</b> — водная оболочка Земли. В неё входят <b>Мировой океан</b>, воды суши (реки, озёра, болота, ледники), <b>подземные воды</b>, водяной пар в воздухе.</p>
 <p>Почти вся вода — около <b>96,5%</b> — находится в Мировом океане, она солёная. <b>Пресной</b> воды всего около <b>2,5%</b>, и большая её часть заморожена в <b>ледниках</b> Антарктиды и Гренландии.</p>

{id:'h2',name:'Мировой океан',place:'Гидросфера',i:'🌊',
 lesson:`<p><b>Мировой океан</b> — единая водная масса, окружающая материки. Его делят на <b>пять океанов</b>: <b>Тихий</b> (самый большой и глубокий), <b>Атлантический</b>, <b>Индийский</b>, <b>Южный</b> и <b>Северный Ледовитый</b> (самый маленький и холодный).</p>
 <p>Части океана: <b>моря</b> (внутренние — далеко вдаются в сушу, окраинные — у края материка), <b>заливы</b> и <b>проливы</b> — узкие полосы воды между участками суши.</p>
 <p>Самое глубокое место — <b>Марианский жёлоб</b> в Тихом океане (около <b>11 км</b>).</p>
 <p><b>Солёность</b> измеряют в <b>промилле</b> (‰) — граммах соли на литр воды. Средняя солёность океана — <b>35‰</b>. Самое солёное море — <b>Красное</b> (около 41‰), одно из самых пресных — <b>Балтийское</b>. Температура воды на поверхности понижается от <b>экватора</b> к <b>полюсам</b>.</p>`,

{id:'h3',name:'Волны и течения',place:'Гидросфера',i:'🌀',
 lesson:`<p>Вода в океане всегда в движении. <b>Ветровые волны</b> рождает ветер. Самые опасные волны — <b>цунами</b>: их вызывают подводные землетрясения и извержения вулканов. У берега цунами превращается в водяную стену.</p>
 <p>Дважды в сутки уровень океана поднимается и опускается — это <b>приливы и отливы</b>. Их вызывает притяжение <b>Луны</b>.</p>
 <p><b>Океанические течения</b> — огромные «реки» в океане. Они бывают <b>тёплыми</b> (несут воду от экватора, например <b>Гольфстрим</b>) и <b>холодными</b> (несут воду от полюсов, например <b>Перуанское</b>). Тёплый Гольфстрим и его продолжение согревают Европу.</p>`,

{id:'h4',name:'Реки',place:'Гидросфера',i:'🏞️',
 lesson:`<p><b>Река</b> — постоянный поток воды, текущий в углублении — <b>русле</b>. Начало реки — <b>исток</b>, место впадения в другую реку, озеро или море — <b>устье</b>. Реки, впадающие в главную, — <b>притоки</b>. Главная река с притоками — <b>речная система</b>, а территория, с которой она собирает воду, — <b>бассейн</b>. Граница бассейнов — <b>водораздел</b>.</p>
 <p>Реки питаются дождевыми, снеговыми, ледниковыми и подземными водами. Ежегодный подъём воды весной — <b>половодье</b>, кратковременный подъём после ливней — <b>паводок</b>, низкий уровень — <b>межень</b>.</p>
 <p><b>Равнинные</b> реки текут медленно, <b>горные</b> — быстро; на них бывают <b>пороги</b> и <b>водопады</b>. Самый высокий водопад — <b>Анхель</b> (979 м). Самая длинная река — <b>Нил</b>, самая полноводная — <b>Амазонка</b>.</p>`,
 tasks:[
  {type:'match',prompt:'Соедини слово с его значением.',pairs:[
   ['Исток','Начало реки'],
   ['Устье','Место впадения реки'],
   ['Приток','Река, впадающая в главную реку'],
   ['Бассейн реки','Территория, с которой река собирает воду'],
   ['Половодье','Ежегодный подъём воды весной'],
   ['Паводок','Кратковременный подъём воды после ливней']]},
  {type:'quiz',questions:[
   {q:'Какая река самая полноводная в мире?',o:['Амазонка','Нил','Волга','Миссисипи'],e:'Амазонка несёт больше всего воды, а Нил — самый длинный.'},
   {q:'Как называется самый высокий водопад мира?',o:['Анхель','Ниагарский','Виктория','Игуасу'],e:'Его высота — 979 метров.'},
   {q:'Граница между бассейнами рек — это…',o:['Водораздел','Русло','Устье','Пойма'],e:'Обычно это возвышенность.'}]}]},
{id:'h5',name:'Озёра, подземные воды и ледники',place:'Гидросфера',i:'🧊',
 lesson:`<p><b>Озеро</b> — водоём в углублении суши (<b>котловине</b>), не связанный с морем. Котловины бывают <b>тектонические</b> (в разломах земной коры — так образовался <b>Байкал</b>, самое глубокое озеро мира, 1642 м), <b>вулканические</b>, <b>ледниковые</b>, <b>старичные</b> (бывшие участки русла реки).</p>
 <p>Озёра бывают <b>сточные</b> (из них вытекает река) и <b>бессточные</b> — они обычно солёные. Самое большое озеро мира — <b>Каспийское море</b>.</p>
 <p><b>Подземные воды</b> собираются в горных породах. Место, где они выходят на поверхность, — <b>родник</b>.</p>
 <p><b>Ледники</b> бывают <b>покровные</b> (огромные ледяные щиты Антарктиды и Гренландии) и <b>горные</b>. Отколовшиеся от ледников глыбы плавают в океане — это <b>айсберги</b>. Там, где почва не оттаивает годами, — <b>многолетняя мерзлота</b>.</p>`,

  {type:'quiz',questions:[
   {q:'Какое озеро самое глубокое в мире?',o:['Байкал','Каспийское море','Ладожское','Виктория'],e:'Его глубина — 1642 м.'},
   {q:'Как называется выход подземных вод на поверхность?',o:['Родник','Устье','Плёс','Залив'],e:'Его ещё называют ключом.'},

{id:'t1',name:'Строение атмосферы',place:'Атмосфера',i:'🌍',
 lesson:`<p><b>Атмосфера</b> — воздушная оболочка Земли. Воздух — смесь газов: <b>азота</b> около <b>78%</b>, <b>кислорода</b> около <b>21%</b>, остальное — аргон, углекислый газ и другие газы.</p>

{id:'t2',name:'Температура воздуха',place:'Атмосфера',i:'🌡️',
 lesson:`<p>Солнечные лучи проходят через воздух, почти не нагревая его. Сначала нагревается <b>земная поверхность</b>, а уже от неё — воздух.</p>
 <p>Температуру измеряют <b>термометром</b>. Днём самая высокая температура бывает около <b>14–15 часов</b>, а самая низкая — перед восходом солнца.</p>
 <p><b>Средняя суточная температура</b> — сумма всех измерений, делённая на их число. <b>Амплитуда</b> температур — разница между самой высокой и самой низкой температурой.</p>
 <p>Чем выше Солнце над горизонтом (больше угол падения лучей), тем сильнее нагревается поверхность. Поэтому у экватора жарко, а у полюсов холодно.</p>`,

  {q:'Днём было +12 °C, ночью −3 °C. Какова амплитуда температур?',o:['15 °C','9 °C','12 °C','3 °C'],e:'Амплитуда — разница: 12 − (−3) = 15 °C.'},
  {q:'За сутки измерили: +2, +4, +6, +4 °C. Какова средняя температура?',o:['+4 °C','+6 °C','+16 °C','+2 °C'],e:'(2 + 4 + 6 + 4) : 4 = 4 °C.'},
  {q:'Когда днём обычно бывает самая высокая температура?',o:['Около 14–15 часов','В полдень, ровно в 12','Утром','Перед восходом солнца'],e:'Земля ещё продолжает отдавать накопленное тепло.'},
  {q:'От чего прежде всего нагревается воздух?',o:['От земной поверхности','Прямо от солнечных лучей','От облаков','От ветра'],e:'Лучи нагревают поверхность, а она — воздух.'},

{id:'t3',name:'Давление и ветер',place:'Атмосфера',i:'🌬️',
 lesson:`<p>Воздух давит на земную поверхность — это <b>атмосферное давление</b>. Его измеряют <b>барометром</b>. <b>Нормальное</b> давление на уровне моря — <b>760 мм рт. ст.</b> С высотой давление понижается — примерно на 1 мм на каждые 10,5 м подъёма.</p>
 <p><b>Ветер</b> — движение воздуха из области <b>высокого</b> давления в область <b>низкого</b>. Направление ветра показывает <b>флюгер</b>, скорость — <b>анемометр</b>. Повторяемость ветров разных направлений изображают на <b>розе ветров</b>.</p>
 <p><b>Бриз</b> меняет направление дважды в сутки: днём дует с моря на сушу, ночью — с суши на море. <b>Муссон</b> меняет направление дважды в год. <b>Пассаты</b> постоянно дуют к экватору.</p>`,

  {q:'Куда дует ветер?',o:['Из области высокого давления в область низкого','Из низкого давления в высокое','Всегда с севера на юг','Всегда от моря'],e:'Воздух «перетекает» туда, где давление ниже.'}]}]},
{id:'t4',name:'Облака и осадки',place:'Атмосфера',i:'🌧️',

 <p>Облака бывают <b>кучевые</b> (белые, пушистые), <b>слоистые</b> (сплошная серая пелена) и <b>перистые</b> (тонкие, высоко в небе, из ледяных кристаллов).</p>
 <p><b>Осадки</b> — вода, выпадающая из облаков: <b>дождь</b>, <b>снег</b>, <b>град</b>. А <b>роса</b> и <b>иней</b> оседают прямо из воздуха на холодных поверхностях. Количество осадков измеряют <b>осадкомером</b> в миллиметрах. Больше всего осадков выпадает у <b>экватора</b>, меньше всего — в <b>пустынях</b> и в полярных областях.</p>`,

  {q:'Перистые облака состоят из ледяных кристаллов.',a:true,e:'Они находятся высоко, где очень холодно.'},
  {q:'Роса и иней оседают прямо из воздуха.',a:true,e:'Они образуются на охладившихся поверхностях.'},

{id:'o2',name:'Жизнь в океане',place:'Биосфера',i:'🐠',
 lesson:`<p>В океане жизнь есть на любой глубине, но больше всего её у поверхности, куда проникает свет, и у берегов.</p>

{id:'o3',name:'Природные зоны',place:'Биосфера',i:'🗺️',
 lesson:`<p>От экватора к полюсам меняются тепло и влага, а вместе с ними — растения, животные и почвы. Так образуются <b>природные зоны</b>, сменяющие друг друга с юга на север. Это называется <b>широтной зональностью</b>.</p>
 <p>Природные зоны: <b>влажные экваториальные леса</b>, <b>саванны</b>, <b>пустыни</b>, <b>степи</b>, <b>смешанные и широколиственные леса</b>, <b>тайга</b> (хвойные леса), <b>тундра</b> (мхи, лишайники, карликовые деревья), <b>арктические пустыни</b>.</p>

{id:'l2',name:'Былины о богатырях',place:'Древняя Русь',i:'⚔️',
 lesson:`<p><b>Былины</b> — народные песни о богатырях и героях Древней Руси. Их исполняли <b>сказители</b> нараспев. В былинах много <b>гипербол</b> (преувеличений), <b>повторов</b> и <b>постоянных эпитетов</b>: «добрый молодец», «чисто поле», «солнышко красное».</p>
 <p><b>«Илья Муромец и Соловей-разбойник»</b>. Илья из села <b>Карачарова</b> под Муромом едет к <b>князю Владимиру</b> в Киев прямоезжей дорогой. Там <b>Соловей-разбойник</b> сидит на дубах и своим свистом валит лес и людей. Илья подбивает его стрелой в глаз и привозит в Киев.</p>
 <p><b>«Садко»</b> — новгородская былина. Бедный <b>гусляр</b> Садко играет на берегу <b>Ильмень-озера</b>. Его музыку слышит <b>Морской царь</b> и помогает ему разбогатеть: Садко бьётся об заклад с купцами, что в озере водится рыба — <b>золотые перья</b>, и выигрывает. Став богатым купцом, Садко попадает на дно моря к Морскому царю, но возвращается домой.</p>`,
 tasks:[
  {type:'sort',prompt:'Из какой былины этот герой или предмет?',done:'Ты отлично знаешь былины!',bins:[{n:'Илья Муромец',i:'🛡️'},{n:'Садко',i:'🪕'}],

{id:'l3',name:'Песни и эпос народов Европы',place:'Народная поэзия',i:'🎶',
 lesson:`<p><b>Народные песни</b> бывают <b>лирическими</b> — о чувствах и переживаниях («Ах, кабы на цветы да не морозы…», «Ах вы ветры, ветры буйные…») и <b>историческими</b> — о событиях и героях. В песне «Чёрный ворон» раненый молодец просит ворона не кружить над ним.</p>
 <p>У других народов Европы тоже есть свой героический эпос.</p>
 <p><b>«Песнь о Роланде»</b> — французский эпос. Отважный <b>Роланд</b>, племянник <b>Карла Великого</b>, гибнет в <b>Ронсевальском ущелье</b> из-за предательства <b>Ганелона</b>. Он слишком поздно трубит в рог <b>Олифант</b>, а свой меч <b>Дюрандаль</b> пытается разбить о скалу, чтобы он не достался врагу.</p>
 <p><b>«Песнь о Нибелунгах»</b> — германский эпос. Герой <b>Зигфрид</b> победил дракона и искупался в его крови, став неуязвимым. Только одно место между лопатками, куда упал липовый листок, осталось уязвимым. Туда его и поразил коварный <b>Хаген</b>.</p>`,

  {type:'match',prompt:'Соедини слово с его значением.',pairs:[['Роланд','Племянник Карла Великого'],['Ганелон','Предатель из «Песни о Роланде»'],['Олифант','Рог Роланда'],['Дюрандаль','Меч Роланда'],['Зигфрид','Победитель дракона из «Песни о Нибелунгах»'],['Хаген','Убийца Зигфрида']]},
  LQ('Выбери ответ',['Какие песни рассказывают о чувствах и переживаниях?',['Лирические','Исторические','Былины','Колыбельные'],'Например, «Ах вы ветры, ветры буйные…».'],
   ['Где погиб Роланд?',['В Ронсевальском ущелье','Под Троей','На Куликовом поле','На острове Итака'],'На отряд Роланда напало огромное войско.'],
   ['Почему у Зигфрида осталось уязвимое место?',['На спину упал липовый листок, когда он купался в крови дракона','Он снял шлем','Его не крестили','Так решил Карл Великий'],'Место между лопатками осталось незащищённым.']),
  LT(['«Песнь о Роланде» — французский героический эпос.',true,'Верно.'],['Зигфрид — герой «Илиады».',false,'Нет, герой германской «Песни о Нибелунгах».'],['Роланд протрубил в рог слишком поздно.',true,'Гордость не позволяла ему позвать на помощь раньше.'])]},
{id:'l4',name:'«Повесть временных лет»',place:'Древнерусская литература',i:'📜',
 lesson:`<p><b>«Повесть временных лет»</b> — самая известная древнерусская <b>летопись</b>. Её составил монах Киево-Печерского монастыря <b>Нестор</b> в начале XII века. Записи в летописи идут по годам: «В лето такое-то…».</p>
 <p>В 6 классе читают <b>«Сказание о белгородском киселе»</b>. <b>Печенеги</b> осадили город <b>Белгород</b>, а князь Владимир ушёл за войском. В городе начался голод, люди решили сдаться. Тогда один <b>старец</b> придумал хитрость: собрать по горсти овса, пшеницы или отрубей, сварить <b>болтушку для киселя</b>, найти лукошко <b>мёда</b> и сделать сладкую сыту. Всё это налили в кадки и опустили в <b>колодцы</b>.</p>
 <p>Позвали печенежских послов, зачерпнули при них из колодцев и накормили. Послы решили, что русских <b>кормит сама земля</b>, и печенеги <b>сняли осаду</b>. Мудрость победила без битвы!</p>`,
 tasks:[
  {type:'order',plain:true,prompt:'Расставь события сказания по порядку.',labels:['1-е','2-е','3-е','4-е','5-е'],items:['Печенеги осадили Белгород','В городе начался голод','Старец придумал хитрость с колодцами','Печенежских послов угостили киселём и сытой','Печенеги сняли осаду'],e:'Вот как мудрость спасла город!'},
  LQ('Выбери ответ',['Кто составил «Повесть временных лет»?',['Монах Нестор','Князь Владимир','Гомер','Сказитель Садко'],'Нестор жил в Киево-Печерском монастыре.'],
   ['Кто осадил Белгород?',['Печенеги','Половцы','Монголы','Шведы'],'Князь Владимир в это время ушёл за войском.'],
   ['Что подумали послы, отведав киселя и сыты?',['Что русских кормит сама земля','Что в городе прячется войско','Что кисель отравлен','Что князь вернулся'],'Поэтому ждать, пока город сдастся от голода, было бесполезно.'],

  LT(['Летопись — это запись событий по годам.',true,'«В лето…» — значит «в год…».'],['Кисель опустили в колодцы в кадках.',true,'Так послы поверили, что еду даёт земля.'],['Хитрость с киселём придумал сам князь Владимир.',false,'Нет, мудрый старец.'])]},

{id:'l6',name:'Стихи Пушкина',place:'Золотой век',i:'🪶',
 lesson:`<p><b>Александр Сергеевич Пушкин</b> (1799–1837) — великий русский поэт.</p>
 <p><b>«Узник»</b> (1822) написан в южной ссылке. Узник в темнице видит в окне молодого <b>орла</b>, который зовёт его: «Мы <b>вольные птицы</b>; пора, брат, пора!» Это стихотворение о мечте о <b>свободе</b>.</p>
 <p><b>«Зимняя дорога»</b>: «Сквозь волнистые туманы пробирается луна…» Мчится <b>тройка</b>, звенит <b>колокольчик однозвучный</b>, поёт <b>ямщик</b>, а путник грустит и мечтает о встрече с <b>Ниной</b>.</p>
 <p><b>«Туча»</b>: «Последняя туча рассеянной бури! Одна ты несёшься по ясной лазури…» Гроза прошла, и туча уже не нужна.</p>
 <p><b>«Песнь о вещем Олеге»</b>: <b>кудесник</b> предсказал князю Олегу смерть от любимого <b>коня</b>. Конь умер, но из его черепа выползла <b>змея</b> и ужалила князя.</p>`,
 tasks:[
  LW('Из какого стихотворения эти строки?',['«Мы вольные птицы; пора, брат, пора!»',['«Узник»','«Туча»','«Зимняя дорога»','«Утёс»'],'Так говорит узнику орёл.'],

   ['«Как ныне сбирается вещий Олег / Отмстить неразумным хазарам…»',['«Песнь о вещем Олеге»','«Узник»','«Три пальмы»','«Туча»'],'Начало баллады.']),

  LT(['«Узник» — стихотворение о мечте о свободе.',true,'Узник и орёл — вольные птицы.'],['В «Зимней дороге» звенит колокольчик однозвучный.',true,'И поёт ямщик.'],['Пушкин жил в XX веке.',false,'Нет, в XIX веке: 1799–1837.'])]},
{id:'l7',name:'«Дубровский»: ссора соседей',place:'Повесть Пушкина',i:'🔥',
 lesson:`<p>Роман <b>«Дубровский»</b> Пушкин написал в 1833 году.</p>
 <p>Богатый и своенравный барин <b>Кирила Петрович Троекуров</b> дружил с соседом — бедным, но гордым <b>Андреем Гавриловичем Дубровским</b>. Однажды на <b>псарне</b> Троекурова псарь обидел Дубровского, тот уехал и потребовал наказать псаря. Друзья поссорились.</p>
 <p>Тогда Троекуров решил отнять у соседа имение <b>Кистенёвку</b>. С помощью заседателя <b>Шабашкина</b> и продажного <b>суда</b> он своего добился. Старый Дубровский от потрясения тяжело заболел.</p>
 <p>Его сын <b>Владимир</b>, молодой офицер, приехал из Петербурга, но отец вскоре умер. Чтобы имение не досталось Троекурову, кузнец <b>Архип</b> поджёг дом вместе с приказными. Владимир Дубровский ушёл с крестьянами в лес и стал <b>благородным разбойником</b>.</p>`,
 tasks:[
  {type:'order',plain:true,prompt:'Расставь события по порядку.',labels:['1-е','2-е','3-е','4-е','5-е'],items:['Ссора на псарне Троекурова','Суд отнимает у Дубровского Кистенёвку','Владимир приезжает к больному отцу','Кузнец Архип поджигает дом','Владимир становится разбойником'],e:'Так началась история благородного разбойника.'},
  {type:'match',prompt:'Соедини героя с его описанием.',pairs:[['Троекуров','Богатый и своенравный барин'],['Андрей Гаврилович','Бедный, но гордый дворянин'],['Владимир','Молодой офицер, сын Дубровского'],['Шабашкин','Заседатель, помогавший Троекурову'],['Архип','Кузнец, поджёгший дом'],['Кистенёвка','Имение Дубровских']]},
  LQ('Выбери ответ',['Из-за чего поссорились старые друзья?',['Из-за обиды на псарне','Из-за карточного долга','Из-за спора о лошадях','Из-за свадьбы детей'],'Псарь Троекурова оскорбил Дубровского.'],
   ['Как Троекуров отнял имение?',['Через продажный суд','Выиграл в карты','Купил за большие деньги','Захватил войском'],'Ему помог заседатель Шабашкин.'],

{id:'l8',name:'«Дубровский»: учитель Дефорж',place:'Повесть Пушкина',i:'🐻',
 lesson:`<p>Владимир Дубровский купил документы у француза-учителя <b>Дефоржа</b> и под его именем поступил в дом Троекурова. Троекуров любил жестокую забаву — запирал гостей в комнате с <b>медведем</b>. Но «Дефорж» не растерялся и застрелил медведя из пистолета.</p>
 <p>Дубровский полюбил дочь Троекурова — <b>Марью Кириловну</b> (Машу). В доме гостил трусливый помещик <b>Антон Пафнутьич Спицын</b>, который прятал деньги в <b>кожаной сумке</b>. Ночью «учитель» забрал у него деньги.</p>
 <p>Троекуров решил выдать Машу за старого богатого <b>князя Верейского</b>. Дубровский обещал её спасти. Маша передала сигнал — <b>кольцо</b> в <b>дупле</b> старого дуба, но его отнёс младший брат Саша и взял другой мальчик. Дубровский опоздал: Машу уже обвенчали, и она отказалась ехать с ним — «<b>Поздно</b>». Дубровский распустил свою шайку и уехал за границу.</p>`,
 tasks:[
  LW('Кто это говорит или делает?',['«Я застрелил медведя, когда меня заперли с ним в комнате».',['Дубровский-Дефорж','Троекуров','Спицын','Князь Верейский'],'Француз-учитель оказался храбрецом.'],
   ['«Я прятал деньги в кожаной сумке, но учитель их забрал».',['Антон Пафнутьич Спицын','Князь Верейский','Шабашкин','Архип'],'Спицын был трусливым и жадным.'],
   ['«Поздно — я обвенчана, я жена князя Верейского».',['Маша Троекурова','Пенелопа','Наталья Савишна','Нина'],'Маша сдержала клятву у алтаря.']),
  LT(['Владимир Дубровский поступил к Троекурову под именем учителя Дефоржа.',true,'Он купил документы у настоящего француза.'],['Машу выдали замуж за молодого Владимира Дубровского.',false,'Нет, за старого князя Верейского.'],['Сигналом для Дубровского было кольцо в дупле дуба.',true,'Но кольцо попало не в те руки.'],['В конце романа Дубровский уезжает за границу.',true,'Он распустил свою шайку.']),

{id:'l9',name:'Стихи Лермонтова',place:'Золотой век',i:'⛰️',
 lesson:`<p><b>Михаил Юрьевич Лермонтов</b> (1814–1841) — поэт, продолживший дело Пушкина. Он любил <b>олицетворение</b> — когда предметы и растения говорят и чувствуют, как люди.</p>
 <p><b>«Три пальмы»</b> (восточное сказание): в аравийской пустыне у родника растут три пальмы. Они <b>ропщут</b>, что растут без пользы. Приходит караван — и люди срубают пальмы на костёр. Родник засыхает.</p>
 <p><b>«Листок»</b>: «Дубовый листок оторвался от ветки родимой…» Он просит приюта у гордой <b>чинары</b> у Чёрного моря, но она прогоняет одинокого скитальца.</p>
 <p><b>«Утёс»</b>: «Ночевала <b>тучка золотая</b> / На груди <b>утёса-великана</b>…» Утром тучка улетела, а утёс остался одиноко плакать.</p>`,
 tasks:[
  {type:'match',prompt:'Соедини стихотворение с героем.',pairs:[['«Три пальмы»','Пальмы, роптавшие на судьбу'],['«Листок»','Дубовый листок-скиталец'],['«Утёс»','Утёс-великан и тучка'],['«Узник»','Узник и молодой орёл'],['«Туча»','Последняя туча после бури'],['«Зимняя дорога»','Тройка, ямщик и колокольчик']]},
  LQ('Выбери ответ',['Что случилось с тремя пальмами?',['Их срубили люди из каравана','Их засыпало песком','Их пересадили в сад','Они выросли до неба'],'Пальмы мечтали о пользе — и были срублены.'],
   ['Кто прогнал дубовый листок?',['Чинара','Пальма','Утёс','Ветер'],'Гордая чинара не пустила скитальца.'],
   ['Как называется приём, когда неживое чувствует, как человек?',['Олицетворение','Гипербола','Рифма','Эпитет'],'Утёс плачет, листок просит, пальмы ропщут.']),
  LT(['«Ночевала тучка золотая…» — начало стихотворения «Утёс».',true,'Верно.'],['«Три пальмы» — восточное сказание.',true,'Действие происходит в аравийской пустыне.'],['Лермонтов жил раньше Пушкина.',false,'Нет, он младше: 1814–1841.'])]},
{id:'l10',name:'Поэты природы',place:'Кольцов, Тютчев, Фет',i:'🍂',
 lesson:`<p><b>Алексей Кольцов</b> — поэт из Воронежа, сын торговца скотом. Он писал о жизни и труде крестьян. В стихотворении <b>«Косарь»</b>: «Раззудись, плечо! Размахнись, рука!»</p>
 <p><b>Фёдор Тютчев</b> — мастер стихов о природе: «<b>Есть в осени первоначальной</b> / Короткая, но дивная пора…» В стихотворении «<b>С поляны коршун поднялся</b>…» человек завидует свободной птице.</p>
 <p><b>Афанасий Фет</b> умел передать одно мгновение и настроение: «<b>Я пришёл к тебе с приветом</b>, / Рассказать, что солнце встало…» и «<b>Учись у них — у дуба, у берёзы</b>…».</p>
 <p>Стихи о природе называют <b>пейзажной лирикой</b>.</p>`,
 tasks:[
  LW('Кто автор этих строк?',['«Раззудись, плечо! Размахнись, рука!»',['Кольцов','Фет','Тютчев','Лермонтов'],'Из стихотворения «Косарь».'],
   ['«Есть в осени первоначальной / Короткая, но дивная пора…»',['Тютчев','Фет','Кольцов','Пушкин'],'Тютчев — певец природы.'],
   ['«Я пришёл к тебе с приветом, / Рассказать, что солнце встало…»',['Фет','Тютчев','Кольцов','Лермонтов'],'Афанасий Фет.'],
   ['«Учись у них — у дуба, у берёзы…»',['Фет','Кольцов','Пушкин','Тютчев'],'Тоже Фет.']),
  LQ('Выбери ответ',['О чём писал Алексей Кольцов?',['О жизни и труде крестьян','О морских путешествиях','О войне с Наполеоном','О космосе'],'Кольцов сам вырос среди степей и деревень.'],
   ['Как называют стихи о природе?',['Пейзажная лирика','Былины','Басни','Эпос'],'Пейзаж — изображение природы.'],
   ['Кто в стихотворении Тютчева поднялся с поляны?',['Коршун','Орёл','Соловей','Голубь'],'«С поляны коршун поднялся…»']),
  LT(['Кольцов родом из Воронежа.',true,'Он был сыном торговца скотом.'],['«Косарь» написал Фет.',false,'Нет, Кольцов.'],['Тютчев и Фет — мастера стихов о природе.',true,'Верно.'])]},
{id:'l11',name:'Свиток поэта',place:'Итог темы',i:'📜',
 lesson:`<p>Ты услышал голоса великих поэтов! Осталось последнее испытание — <b>Свиток поэта</b>. Вспомни приёмы, которыми поэты оживляют стихи:</p>
 <p><b>Эпитет</b> — красочное определение («тучка <b>золотая</b>»). <b>Сравнение</b> — сопоставление со словами «как», «будто» («белый, <b>как снег</b>»). <b>Метафора</b> — скрытое сравнение («<b>утёс-великан</b>»). <b>Олицетворение</b> — неживое ведёт себя как живое («утёс <b>плачет</b>»).</p><p>Пройдёшь — получишь <b>гусиное перо поэта</b> и грамоту!</p>`,
 tasks:[
  {type:'sort',prompt:'Какой это приём?',done:'Ты мастер поэтических приёмов!',bins:[{n:'Эпитет',i:'🎨'},{n:'Сравнение',i:'🔍'},{n:'Олицетворение',i:'🗣️'}],
   items:[['Тучка золотая',0],['Белый, как снег',1],['Утёс заплакал',2],['Колокольчик однозвучный',0],['Пальмы роптали',2],['Глаза, словно звёзды',1],['Ясная лазурь',0],['Чинара прогнала листок',2],['Лёд, будто стекло',1]]},
  LF(['Стихотворение «Узник» написал ___.',['Пушкин','Лермонтов','Фет'],'Александр Сергеевич Пушкин.'],['Стихотворение «Утёс» написал ___.',['Лермонтов','Пушкин','Тютчев'],'Михаил Юрьевич Лермонтов.'],['Троекуров отнял у Дубровского имение ___.',['Кистенёвку','Карачарово','Итаку'],'Через продажный суд.'],['«Раззудись, плечо!» — из стихотворения «___».',['Косарь','Туча','Листок'],'Алексей Кольцов.'],['Под именем Дефоржа Дубровский стал ___.',['учителем','судьёй','кузнецом'],'Учителем французского.']),
  LQ('Выбери ответ',['Что такое метафора?',['Скрытое сравнение','Повтор слов','Преувеличение','Рифма в конце строки'],'Например, «утёс-великан».'],
   ['Чем закончился роман «Дубровский»?',['Дубровский распустил шайку и уехал за границу','Дубровский женился на Маше','Троекуров вернул Кистенёвку','Дубровского поймали'],'Маша осталась женой князя Верейского.'])]}
];

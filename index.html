{id:'l12',name:'Тургенев. «Бежин луг»',place:'Записки охотника',i:'🔥',
 lesson:`<p><b>Иван Сергеевич Тургенев</b> написал цикл рассказов <b>«Записки охотника»</b>. В рассказе <b>«Бежин луг»</b> охотник заблудился вечером и вышел к лугу, где у <b>костра</b> ночевали крестьянские мальчики — они стерегли табун в <b>ночном</b>.</p>
 <p>Их пятеро: <b>Федя</b> — старший, из богатой семьи; <b>Павлуша</b> — некрасивый, но умный и <b>смелый</b>; <b>Ильюша</b> — знаток страшных <b>поверий</b>; <b>Костя</b> — задумчивый и печальный; <b>Ваня</b> — самый маленький, назвал звёзды «<b>божьими пчёлками</b>».</p>
 <p>Мальчики всю ночь рассказывали истории про <b>домового</b>, <b>лешего</b>, <b>русалку</b> и <b>водяного</b>. Тургенев с любовью рисует <b>природу</b> и детей. В конце рассказчик сообщает, что Павел в том же году погиб — упал с лошади.</p>`,
 tasks:[
  {type:'match',prompt:'Соедини мальчика с его описанием.',pairs:[['Федя','Старший, из богатой семьи'],['Павлуша','Смелый и умный, не боялся волков'],['Ильюша','Знал больше всех страшных поверий'],['Костя','Задумчивый и печальный'],['Ваня','Самый маленький, звёзды — «божьи пчёлки»'],['Рассказчик','Охотник, заблудившийся вечером']]},
  LQ('Выбери ответ',['Какой цикл рассказов написал Тургенев?',['«Записки охотника»','«Детство»','«Повести Белкина»','«Сказки»'],'«Бежин луг» — один из них.'],
   ['Зачем мальчики ночевали в поле?',['Стерегли табун лошадей в ночном','Собирали грибы','Убежали из дома','Ловили рыбу'],'Это называлось «ходить в ночное».'],
   ['О чём мальчики рассказывали у костра?',['О домовом, леших, русалках и водяных','О морских сражениях','О школе','О Троянской войне'],'Страшные народные поверья.'],
   ['Что случилось с Павлушей в том же году?',['Он погиб, упав с лошади','Уехал в город','Стал охотником','Нашёл клад'],'Грустный конец рассказа.']),
  LT(['Рассказчик «Бежина луга» — охотник.',true,'Он заблудился и вышел к костру.'],['Павлуша боялся всего на свете.',false,'Нет, он был самым смелым.'],['Тургенев с любовью изображает природу.',true,'Описания ночи и утра — одни из лучших в русской литературе.'])]},
{id:'l13',name:'Лесков. «Левша»',place:'Сказ о тульском мастере',i:'🦗',
 lesson:`<p><b>Николай Семёнович Лесков</b> написал <b>сказ</b> — рассказ как бы от лица простого человека, с народными словечками. Полное название: «<b>Сказ о тульском косом Левше и о стальной блохе</b>».</p>
 <p>Император <b>Александр I</b> с атаманом <b>Платовым</b> побывал в Англии. Англичане подарили ему крошечную <b>стальную блоху</b>, которая умела танцевать. Позже император <b>Николай I</b> велел Платову показать её русским мастерам.</p>
 <p>Трое <b>тульских</b> мастеров во главе с косым <b>Левшой</b> работали много дней и <b>подковали блоху</b>! А Левша выковал <b>гвоздики</b> для подковок — без всякого «мелкоскопа» (микроскопа).</p>
 <p>Левшу отправили в Англию. Англичане уговаривали его остаться, но он вернулся на родину. Перед смертью он просил передать государю: «<b>У англичан ружья кирпичом не чистят</b>» — чтобы не испортить ружья. Но его слова так и не передали.</p>`,
 tasks:[
  {type:'order',plain:true,prompt:'Расставь события сказа по порядку.',labels:['1-е','2-е','3-е','4-е','5-е'],items:['Англичане дарят Александру I стальную блоху','Николай I отправляет Платова с блохой в Тулу','Тульские мастера подковывают блоху','Левша едет в Англию','Левша просит передать: «Ружья кирпичом не чистят»'],e:'Так тульский мастер прославил Россию.'},
  LQ('Выбери ответ',['Что сделали тульские мастера с английской блохой?',['Подковали её','Разобрали на части','Сделали её больше','Научили петь'],'Но от подковок блоха перестала танцевать.'],
   ['Что выковал сам Левша?',['Гвоздики для подковок','Подковы','Ключик','Мелкоскоп'],'Такие крошечные, что их не видно даже в мелкоскоп.'],
   ['Как называется рассказ от лица простого человека с народными словечками?',['Сказ','Былина','Басня','Летопись'],'«Мелкоскоп», «нимфозория» — это словечки сказителя.'],
   ['Что просил передать государю Левша?',['Что у англичан ружья кирпичом не чистят','Что он хочет остаться в Англии','Что блоха сломалась','Что ему нужна награда'],'Он заботился о своей стране до последней минуты.']),
  LT(['Левша был тульским мастером.',true,'Тула славилась оружейниками.'],['Левша остался жить в Англии.',false,'Нет, он вернулся на родину.'],['С Александром I в Англии был атаман Платов.',true,'Платов — один из главных героев сказа.'])]},
{id:'l14',name:'Толстой. «Детство»',place:'Повесть о Николеньке',i:'🧸',
 lesson:`<p><b>Лев Николаевич Толстой</b> написал <b>автобиографическую</b> повесть <b>«Детство»</b> — то есть во многом о себе. Это первая часть трилогии «Детство. Отрочество. Юность».</p>
 <p>Главный герой — десятилетний <b>Николенька Иртеньев</b>. Рассказ ведётся от его лица. Вот его близкие: добрый учитель-немец <b>Карл Иваныч</b>, которого Николенька сначала обидел, а потом пожалел; нежная <b>maman</b> (мама); отец; преданная экономка <b>Наталья Савишна</b>, которая когда-то нянчила маму.</p>
 <p>Толстой показывает, как мальчик учится понимать чувства других людей, стыдиться своих плохих поступков и ценить любовь близких.</p>`,
 tasks:[
  LQ('Выбери ответ',['Как зовут главного героя повести «Детство»?',['Николенька Иртеньев','Ваня','Левша','Владимир Дубровский'],'Ему десять лет.'],
   ['Кто такой Карл Иваныч?',['Учитель-немец','Отец Николеньки','Дядька-крепостной','Сосед-помещик'],'Николенька сначала рассердился на него, а потом пожалел.'],
   ['Кто такая Наталья Савишна?',['Экономка, когда-то нянчившая маму','Сестра Николеньки','Учительница музыки','Соседка'],'Она всю жизнь преданно служила семье.'],
   ['Что значит «автобиографическая» повесть?',['Автор рассказывает во многом о себе','Повесть о путешествиях','Повесть о животных','Повесть-сказка'],'Толстой вспоминал своё детство.']),
  LT(['Рассказ в повести «Детство» ведётся от лица Николеньки.',true,'Мы видим мир его глазами.'],['«Детство» — первая часть трилогии Толстого.',true,'Дальше — «Отрочество» и «Юность».'],['Николенька никогда не стыдился своих поступков.',false,'Нет, он часто раскаивается и учится понимать других.'],['Повесть «Детство» написал Тургенев.',false,'Нет, Лев Толстой.'])]},
{id:'l15',name:'Чехов: смешное и грустное',place:'Рассказы Чехова',i:'🎭',
 lesson:`<p><b>Антон Павлович Чехов</b> писал короткие <b>юмористические</b> рассказы. Он высмеивал <b>чинопочитание</b> — когда человек унижается перед начальством. Часто у его героев <b>говорящие фамилии</b>.</p>
 <p><b>«Толстый и тонкий»</b>: на вокзале встречаются школьные друзья. Тонкий радуется встрече, но, узнав, что толстый — важный <b>тайный советник</b>, начинает угодливо кланяться.</p>
 <p><b>«Хамелеон»</b>: собака укусила за палец мастера <b>Хрюкина</b>. Полицейский надзиратель <b>Очумелов</b> то грозит собаку уничтожить, то хвалит её — смотря чья она: простая или <b>генеральская</b>. Как хамелеон, он меняет «цвет».</p>
 <p><b>«Смерть чиновника»</b>: в театре чиновник <b>Червяков</b> чихнул на лысину генерала <b>Бризжалова</b> и так замучил его извинениями, что генерал прогнал его. Червяков пришёл домой и… умер от страха.</p>`,
 tasks:[
  {type:'match',prompt:'Соедини героя с рассказом.',pairs:[['Очумелов','«Хамелеон»'],['Хрюкин','«Хамелеон», укушенный палец'],['Червяков','«Смерть чиновника»'],['Бризжалов','Генерал, на которого чихнули'],['Тонкий','Угодничал перед старым другом'],['Тайный советник','Чин толстого']]},
  LW('Кто это мог сказать?',['«Собака-то генеральская? Тогда это другое дело!»',['Очумелов','Червяков','Тонкий','Хрюкин'],'Хамелеон меняет мнение.'],
   ['«Извините, ваше превосходительство, я вас обрызгал… я нечаянно!»',['Червяков','Очумелов','Толстый','Левша'],'Он извинялся снова и снова.'],
   ['«Ваше превосходительство… Очень приятно-с!»',['Тонкий','Толстый','Бризжалов','Хрюкин'],'Узнав о чине друга, тонкий стал угодничать.']),
  LT(['Чехов высмеивал чинопочитание.',true,'Он считал, что человек должен уважать себя.'],['Очумелов всегда твёрдо держался одного мнения.',false,'Нет, он менял мнение, как хамелеон — цвет.'],['Червяков чихнул на генерала в театре.',true,'Всё началось с этого чиха.'])]},
{id:'l16',name:'Куприн. «Чудесный доктор»',place:'Рождественский рассказ',i:'🎄',
 lesson:`<p><b>Александр Иванович Куприн</b> написал рассказ <b>«Чудесный доктор»</b>, основанный на <b>реальном случае</b>.</p>
 <p>Накануне <b>Рождества</b> семья <b>Мерцаловых</b> живёт в сыром подвале и бедствует. Отец <b>Емельян</b> потерял работу, маленькая дочка тяжело больна, есть нечего. Сыновья — <b>Володя и Гриша</b> — бегают по городу, глядя на праздничные витрины.</p>
 <p>В отчаянии отец бродит по городу и в саду встречает незнакомого старичка. Тот приходит к ним домой, лечит девочку, оставляет денег и уходит. Только по подписи на рецепте узнают, что это знаменитый врач <b>Пирогов</b>.</p>
 <p>Рассказ учит <b>милосердию</b> и вере: доброе дело может спасти целую семью.</p>`,

{id:'l19',name:'Распутин. «Уроки французского»',place:'Рассказ о взрослении',i:'🍎',
 lesson:`<p><b>Валентин Распутин</b> написал рассказ <b>«Уроки французского»</b> о своём послевоенном детстве.</p>
 <p>Одиннадцатилетний мальчик из деревни учится в районном посёлке, живёт один и <b>голодает</b>. Чтобы купить молока, он начинает играть на деньги в «<b>чику</b>» со старшими ребятами — и его жестоко избивают за то, что он всё время выигрывает.</p>
 <p>Молодая учительница французского <b>Лидия Михайловна</b> занимается с ним дополнительно и хочет помочь. Мальчик гордо отказывается от <b>посылки с макаронами</b>. Тогда она начинает играть с ним на деньги в «<b>замеряшки</b>», нарочно проигрывая, чтобы у него были деньги на еду.</p>
 <p>Директор школы застаёт их за игрой, и Лидию Михайловну <b>увольняют</b>. Она уезжает к себе на <b>Кубань</b>, а зимой присылает мальчику посылку с макаронами и тремя красными <b>яблоками</b>. Рассказ — о <b>доброте</b> и бескорыстии.</p>`,

{id:'l20',name:'Взросление и фантастика',place:'Повести XX века',i:'🚀',

 <p><b>Кир Булычёв</b> — автор фантастики. В повести <b>«Сто лет тому вперёд»</b> школьник <b>Коля Наумов</b> через <b>машину времени</b> попадает в будущее и знакомится с <b>Алисой Селезнёвой</b>. Они спасают <b>миелофон</b> — прибор, читающий мысли, — от <b>космических пиратов</b> Весельчака У и Крыса.</p>

{id:'l21',name:'Дефо. «Робинзон Крузо»',place:'Зарубежная литература',i:'🏝️',
 lesson:`<p>Английский писатель <b>Даниэль Дефо</b> в 1719 году издал роман <b>«Робинзон Крузо»</b>.</p>
 <p>Моряк <b>Робинзон</b> мечтал о море и ушёл из дома против воли отца. После <b>кораблекрушения</b> он оказался один на <b>необитаемом острове</b> и прожил там <b>28 лет</b>.</p>
 <p>Робинзон не пал духом: перевёз с разбитого корабля инструменты, построил жилище, научился выращивать <b>хлеб</b>, лепить посуду, приручил коз и <b>попугая</b>. Дни он отмечал <b>зарубками на столбе</b> и вёл <b>дневник</b>.</p>
 <p>Однажды он спас пленника от людоедов и назвал его <b>Пятницей</b> — по дню недели, когда это случилось. Пятница стал его верным другом. Книга — о силе человека, его <b>труде</b> и надежде.</p>`,

{id:'l22',name:'Свифт. «Путешествия Гулливера»',place:'Зарубежная литература',i:'🧭',

document.addEventListener('pointerdown',()=>{const a=ac();if(a&&!audioUnlocked){const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);audioUnlocked=true}},{passive:true});
function tone(f,d,t=0,type='sine',v=.15){if(!soundOn)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),st=a.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+d);o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+d+.05)}

function modal(html){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="card">${html}</div>`;document.body.appendChild(o);return o}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function smoothClosed(p){const n=p.length,f=v=>v.toFixed(1);let d=`M${f(p[0][0])},${f(p[0][1])}`;for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];d+=`C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`}return d+'Z'}
function smoothOpen(p){const n=p.length,f=v=>v.toFixed(1);let d=`M${f(p[0][0])},${f(p[0][1])}`;for(let i=0;i<n-1;i++){const p0=p[Math.max(i-1,0)],p1=p[i],p2=p[i+1],p3=p[Math.min(i+2,n-1)];d+=`C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`}return d}
function blob(cx,cy,rx,ry,seed,n=12,j=.3){const r=rng(seed),p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=1-j/2+r()*j;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return smoothClosed(p)}
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
function ribbon(x,y,text,fs=13,fill='#7a2a12',col='#fff4d6',clamp=true){const w=text.length*fs*.52+18;if(clamp)x=Math.max(w/2+12,Math.min(388-w/2,x));return `<g><rect x="${x-w/2}" y="${y-fs+1}" width="${w}" height="${fs+8}" rx="6" fill="${fill}" opacity=".92"/><text x="${x}" y="${y+2}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="700">${esc(text)}</text></g>`}
function confetti(){const e=['⭐','✨','🎉','🏅','🛡️','👑'];for(let i=0;i<34;i++){const c=document.createElement('div');c.className='confetti';c.textContent=e[i%e.length];c.style.left=Math.random()*100+'vw';c.style.animationDuration=(2.2+Math.random()*2)+'s';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5200)}}

let run=null;

function backToMap(){Q.back==='classes'?classes():Q.back==='timeline'?timelineScreen():Q.noMap?historyMap():questMap()}
function taskHead(sub){
 const st=run.st,n=st.tasks.length,frac=(run.t+(sub||0))/n;
 return `<div class="thead"><button class="btn ghost" id="quit">✕</button><div class="tt">${run.i+1}. ${esc(st.name)}</div><span class="chip">❌ <span id="mc">${run.mistakes}</span></span>${soundBtn()}</div>
 <div class="bar"><i style="width:${Math.round(frac*100)}%"></i></div>`}
function bindHead(){bindSound();$('#quit').onclick=()=>{const o=modal(`<h2>Выйти из испытания?</h2><p>Прогресс этого испытания не сохранится.</p><div class="row"><button class="btn" id="st">Остаться</button><button class="btn ghost" style="background:#7a5a30" id="ex">Выйти</button></div>`);$('#st',o).onclick=()=>o.remove();$('#ex',o).onclick=()=>{o.remove();backToMap()}}}
function miss(detail){run.mistakes++;if(detail)run.errs.push(detail);const m=$('#mc');if(m)m.textContent=run.mistakes;SFX.bad()}
const BG_TASK='linear-gradient(#5a3e24,#2e1f12)';
function lesson(){
 const st=run.st;
 screen(`${taskHead(0)}
 <div class="card lesson"><div class="scrollic">${st.i}</div><h2>Свиток знаний: ${esc(st.name)}</h2>${st.lesson}</div>
 <div class="row"><button class="btn ghost" style="background:#7a5a30;flex:0 0 auto" id="tts">🔊 Послушать</button><button class="btn" id="go">⚔️ К испытанию!</button></div>`,BG_TASK);
 bindHead();$('#go').onclick=()=>{SFX.click();nextTask()};
 $('#tts').onclick=()=>{const on=speak(st.lesson);$('#tts').textContent=on?'⏹ Стоп':'🔊 Послушать'};
}
function nextTask(){
 const st=run.st;
 if(run.t>=st.tasks.length)return finish();
 const task=st.tasks[run.t];
 const done=()=>{run.t++;nextTask()};
 ({quiz:quizTask,tf:quizTask,fill:quizTask,odd:quizTask,who:quizTask,sort:sortTask,match:matchTask,order:orderTask,map:mapTask,cross:crossTask,mistake:mistakeTask,timeline:timelineTask})[task.type](task,done);
}

   if(ok){SFX.ok()}else{b.classList.remove('dim');b.classList.add('bad');shake($('#qc'));miss(`${Q.q} — ответ: «${isTF?(opts[k][1]?'Правда':'Ложь'):opts[k][0]}», верно: «${isTF?(Q.a?'Правда':'Ложь'):Q.o[0]}»`)}
   if(isFill){const bl=$('#blank');bl.textContent=Q.o[0]}

 }

function sortTask(task,done){

 function show(){
  if(k>=items.length){
   screen(`${taskHead(1)}<div class="card res"><div style="font-size:46px">🎯</div><h2>${esc(task.done||'Все разложены по сословиям!')}</h2>

   <button class="btn wide" id="next">Дальше →</button>`,BG_TASK);bindHead();$('#next').onclick=()=>{SFX.click();done()};return}
  const it=items[k];
  screen(`${taskHead(k/items.length)}
  <div class="card" id="sc"><div class="qnum">${esc(task.prompt)}</div>
  <div class="sortcard" id="cardv">${esc(it[0])}${it[2]?`<small>(${esc(it[2])})</small>`:''}</div>
  <div class="bins">${task.bins.map((b,i)=>`<button class="bin" data-b="${i}"><span class="bi">${b.i}</span><span class="bn">${b.n}</span><span class="bl">${got[i].join(', ')}</span></button>`).join('')}</div>
  <div class="left">Осталось: ${items.length-k}</div></div>`,BG_TASK);
  bindHead();
  $$('.bin').forEach(b=>b.onclick=()=>{

function matchTask(task,done){
 const terms=shuffle(task.pairs.map((p,i)=>[p[0],i])),defs=shuffle(task.pairs.map((p,i)=>[p[1],i]));
 let sel=null,left=task.pairs.length;

 <div class="terms">${terms.map(t=>`<button class="term" data-i="${t[1]}">${esc(t[0])}</button>`).join('')}</div>

 </div><button class="btn wide" id="next" style="display:none">Дальше →</button>`,BG_TASK);
 bindHead();
 const pick=(el,kind)=>{
  if(!sel||sel.kind===kind){$$('.sel').forEach(x=>x.classList.remove('sel'));sel={el,kind};el.classList.add('sel');SFX.click();return}
  const a=sel.el,b=el;sel=null;$$('.sel').forEach(x=>x.classList.remove('sel'));
  if(a.dataset.i===b.dataset.i){SFX.ok();a.classList.add('done');b.classList.add('done');left--;
   if(left===0){const nx=$('#next');nx.style.display='block';nx.onclick=()=>{SFX.click();done()};nx.scrollIntoView({behavior:'smooth'});toast('Все слова на месте! 🎉')}}
  else{const tt=(a.classList.contains('term')?a:b),dd=(tt===a?b:a);miss(`Соединил «${tt.textContent}» с «${dd.textContent}»`);[a,b].forEach(x=>{x.classList.add('flash');shake(x)});setTimeout(()=>[a,b].forEach(x=>x.classList.remove('flash')),600)}
 };
 $$('.term').forEach(t=>t.onclick=()=>pick(t,'t'));
 $$('.def').forEach(d=>d.onclick=()=>pick(d,'d'));
}

function orderTask(task,done){
 const n=task.items.length;let slots=Array(n).fill(null),pool=shuffle(task.items.map((t,i)=>i)),checked=null;
 function show(){
  const full=slots.every(s=>s!==null);
  screen(`${taskHead(0)}
  <div class="card" id="oc"><div class="qnum">${esc(task.prompt)}</div>
  <div class="ladder">${slots.map((s,i)=>`<button class="step ${s!==null?'full':''} ${checked&&s!==null?(s===i?'ok':'bad'):''}" data-s="${i}" style="width:${task.plain?100:52+i*16}%">${task.plain?`<span style="opacity:.6;white-space:nowrap;margin-right:6px">${task.labels[i]}</span>`:''}${s!==null?esc(task.items[s]):(task.plain?'…':`ступень ${i+1}`)}</button>`).join('')}</div>
  <div class="pool">${pool.map(p=>`<button class="term" data-p="${p}">${esc(task.items[p])}</button>`).join('')}</div>
  <div id="ex"></div></div>
  <button class="btn wide" id="chk" ${full?'':'disabled'}>Проверить</button>`,BG_TASK);
  bindHead();
  $$('[data-p]').forEach(b=>b.onclick=()=>{const p=+b.dataset.p,e=slots.indexOf(null);if(e<0)return;slots[e]=p;pool=pool.filter(x=>x!==p);checked=null;SFX.click();show()});
  $$('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(slots[i]===null)return;pool.push(slots[i]);slots[i]=null;checked=null;SFX.click();show()});
  $('#chk').onclick=()=>{
   if(slots.every((s,i)=>s===i)){SFX.ok();checked=true;
    $$('.step').forEach(x=>x.classList.add('ok'));$$('.step').forEach(x=>x.onclick=null);
    $('#ex').innerHTML=`<div class="expl good"><b>Отлично!</b> ${esc(task.e)}</div>`;
    const c=$('#chk');c.textContent='Дальше →';c.onclick=()=>{SFX.click();done()};
   }else{miss(`Неверный порядок: ${slots.map(x=>task.items[x]).join(' → ')}`);checked=true;show();shake($('#oc'));toast('Красные ступени стоят не на месте — нажми на них, чтобы убрать')}
  };
 }
 show();
}

 const qs=shuffle(task.questions);let q=0;const shown=new Set();
 const svg=(extra='',hl='',route=[])=>`<svg viewBox="0 0 ${G.W} ${G.H}" class="map" id="msvg" style="border-radius:12px;box-shadow:none;border:2px solid #c09a58">${G.g}

  ${pts.map((p,i)=>`<g data-p="${i}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="16" fill="transparent"/>${hl===p.n?`<circle cx="${p.x}" cy="${p.y}" r="13" fill="#ffd34d" class="pulse"/>`:''}<circle cx="${p.x}" cy="${p.y}" r="7" fill="${shown.has(p.n)?'#3f7d3a':'#a8322a'}" stroke="#fff" stroke-width="2"/>${shown.has(p.n)?`<text x="${p.x}" y="${p.y-11}" font-size="12" text-anchor="middle" font-weight="700" fill="#3b2a1a" class="halo">${esc(p.n)}</text>`:''}</g>`).join('')}${extra}</svg>`;
 function ask(){

  const Q=qs[q];
  screen(`${taskHead(q/(qs.length+(task.route?1:0)))}
  <div class="card"><div class="qnum">🗺️ ${esc(task.prompt||'Контурная карта')} · ${q+1} из ${qs.length}</div><div class="qtext">${esc(Q.q)}</div>${svg()}<div id="ex"></div></div>
  <button class="btn wide" id="next" style="display:none">Дальше →</button>`,BG_TASK);

  $$('[data-p]').forEach(g=>g.onclick=()=>{if(answered)return;answered=true;const p=pts[+g.dataset.p],ok=p.n===Q.a;

   if(ok)SFX.ok();else miss(`Карта: «${Q.q}» — показал «${p.n}», верно «${Q.a}»`);
   $('#msvg').outerHTML=svg('',ok?'':Q.a);
   $('#ex').innerHTML=`<div class="expl ${ok?'good':'wrong'}"><b>${ok?'Верно!':'Не совсем.'}</b> ${ok?'Это '+esc(Q.a)+'.':'Ты показал «'+esc(p.n)+'», а '+esc(Q.a)+' — там, где мигает точка.'}</div>`;
   const nx=$('#next');nx.style.display='block';nx.onclick=()=>{SFX.click();q++;ask()};nx.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
 }
 function routeStep(){
  const R=task.route,path=[];
  const draw=()=>{screen(`${taskHead(qs.length/(qs.length+1))}
  <div class="card"><div class="qnum">🗺️ Маршрут</div><div class="qtext">${esc(R.q)}</div>${svg('','',path)}<div class="small" style="margin-top:6px">Отмечено: ${path.length?path.map(esc).join(' → '):'—'}</div><div id="ex"></div></div>
  <button class="btn wide" id="next" style="display:none">Дальше →</button>`,BG_TASK);bindHead();
   $$('[data-p]').forEach(g=>g.onclick=()=>{if(path.length>=R.seq.length)return;const p=pts[+g.dataset.p],want=R.seq[path.length];
    if(p.n===want){SFX.ok();path.push(p.n);shown.add(p.n);draw();

/* --- кроссворд --- */
function buildCross(words){
 const ws=words.map(([w,c])=>({w:w.toUpperCase().replace(/Ё/g,'Е'),c}));
 let best=null;
 for(let att=0;att<80;att++){
  const order=att?shuffle(ws):ws.slice().sort((a,b)=>b.w.length-a.w.length);
  const grid=new Map(),placed=[];
  const at=(x,y)=>grid.get(x+','+y);
  const fits=(w,x,y,dir)=>{
   const dx=dir?0:1,dy=dir?1:0;
   if(at(x-dx,y-dy)||at(x+dx*w.length,y+dy*w.length))return false;
   let cross=0;
   for(let i=0;i<w.length;i++){const cx=x+dx*i,cy=y+dy*i,c=at(cx,cy);
    if(c){if(c!==w[i])return false;cross++}
    else if(at(cx+dy,cy+dx)||at(cx-dy,cy-dx))return false}
   return cross>0&&cross<w.length;
  };
  const put=(wd,x,y,dir)=>{for(let i=0;i<wd.w.length;i++)grid.set((dir?x:x+i)+','+(dir?y+i:y),wd.w[i]);placed.push(Object.assign({},wd,{x,y,dir}))};
  put(order[0],0,0,0);
  for(const wd of order.slice(1)){
   const cands=[];
   placed.forEach(p=>{for(let i=0;i<p.w.length;i++)for(let j=0;j<wd.w.length;j++){if(p.w[i]!==wd.w[j])continue;const dir=1-p.dir,cx=p.dir?p.x:p.x+i,cy=p.dir?p.y+i:p.y,x=dir?cx:cx-j,y=dir?cy-j:cy;if(fits(wd.w,x,y,dir))cands.push([x,y,dir])}});
   if(!cands.length)continue;
   const bb=()=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;placed.forEach(p=>{a=Math.min(a,p.x);c=Math.min(c,p.y);b=Math.max(b,p.dir?p.x:p.x+p.w.length-1);d=Math.max(d,p.dir?p.y+p.w.length-1:p.y)});return[a,b,c,d]};
   const [a,b,c,d]=bb();
   cands.sort((u,v)=>{const ar=([x,y,dir])=>{const x2=dir?x:x+wd.w.length-1,y2=dir?y+wd.w.length-1:y;return (Math.max(b,x2)-Math.min(a,x)+1)*(Math.max(d,y2)-Math.min(c,y)+1)+Math.abs((Math.max(b,x2)-Math.min(a,x))-(Math.max(d,y2)-Math.min(c,y)))*2};return ar(u)-ar(v)});
   const [x,y,dir]=cands[Math.min(cands.length-1,Math.floor(Math.random()*Math.min(2,cands.length)))];put(wd,x,y,dir);
  }
  let a=1e9,b=-1e9,c=1e9,d=-1e9;placed.forEach(p=>{a=Math.min(a,p.x);c=Math.min(c,p.y);b=Math.max(b,p.dir?p.x:p.x+p.w.length-1);d=Math.max(d,p.dir?p.y+p.w.length-1:p.y)});
  const cols=b-a+1,rows=d-c+1,score=placed.length*1000-cols*rows-(cols>13?500:0);
  if(!best||score>best.score)best={score,cols,rows,placed:placed.map(p=>Object.assign(p,{x:p.x-a,y:p.y-c}))};
  if(best.placed.length===ws.length&&best.cols<=12&&att>20)break;
 }
 const starts=[...new Set(best.placed.map(p=>p.y*100+p.x))].sort((u,v)=>u-v);
 best.placed.forEach(p=>p.num=starts.indexOf(p.y*100+p.x)+1);
 best.placed.sort((u,v)=>u.num-v.num||u.dir-v.dir);
 return best;
}
function crossTask(task,done){
 const C=buildCross(task.words),solved=new Set();
 const cell=Math.min(30,Math.floor(330/C.cols));
 function draw(){
  const cells=new Map();
  C.placed.forEach((p,k)=>{for(let i=0;i<p.w.length;i++){const x=p.dir?p.x:p.x+i,y=p.dir?p.y+i:p.y,key=x+','+y;const o=cells.get(key)||{x,y,ch:p.w[i],show:false,num:0};if(solved.has(k))o.show=true;if(i===0)o.num=p.num;cells.set(key,o)}});
  const grid=`<div style="position:relative;width:${C.cols*cell}px;height:${C.rows*cell}px;margin:8px auto">${[...cells.values()].map(o=>`<div style="position:absolute;left:${o.x*cell}px;top:${o.y*cell}px;width:${cell-2}px;height:${cell-2}px;background:${o.show?'#e9f6df':'#fffaf0'};border:1.5px solid #8a6232;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${Math.round(cell*.55)}px;color:#3b2a1a">${o.num?`<span style="position:absolute;left:2px;top:0;font-size:${Math.max(8,Math.round(cell*.3))}px;color:#a8322a">${o.num}</span>`:''}${o.show?o.ch:''}</div>`).join('')}</div>`;
  screen(`${taskHead(solved.size/C.placed.length)}
  <div class="card"><div class="qnum">🔤 ${esc(task.prompt||'Кроссворд')} · разгадано ${solved.size} из ${C.placed.length}</div>${grid}
  <div>${C.placed.map((p,k)=>`<button class="def ${solved.has(k)?'done':''}" data-k="${k}" ${solved.has(k)?`data-t="${p.num} ${p.dir?'↓':'→'} ${p.w}"`:''}><b>${p.num} ${p.dir?'↓':'→'}</b> ${esc(p.c)} <span class="small" style="color:#7a5a30">(${p.w.length} букв)</span></button>`).join('')}</div></div>
  ${solved.size===C.placed.length?'<button class="btn green wide" id="next">Кроссворд разгадан! Дальше →</button>':''}`,BG_TASK);
  bindHead();
  if($('#next'))$('#next').onclick=()=>{SFX.click();done()};
  $$('.def[data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,p=C.placed[k];if(solved.has(k))return;
   const o=modal(`<div class="qnum">${p.num} ${p.dir?'↓ по вертикали':'→ по горизонтали'} · ${p.w.length} букв</div><h2 style="margin:6px 0">${esc(p.c)}</h2><input class="name" id="ans" autocomplete="off" autocapitalize="characters" maxlength="${p.w.length+2}" placeholder="${'_ '.repeat(p.w.length).trim()}"><div class="row"><button class="btn ghost" style="background:#7a5a30" id="give">Показать ответ</button><button class="btn" id="ok">Проверить</button></div>`);
   const inp=$('#ans',o);setTimeout(()=>inp.focus(),100);
   const check=()=>{const v=inp.value.trim().toUpperCase().replace(/Ё/g,'Е').replace(/\s/g,'');if(!v)return;
    if(v===p.w){SFX.ok();solved.add(k);o.remove();draw()}else{miss(`Кроссворд: «${p.c}» — ответ «${v}», верно «${p.w}»`);shake(inp);inp.value='';toast(`Не подходит. Первая буква — «${p.w[0]}»`)}};
   $('#ok',o).onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
   $('#give',o).onclick=()=>{miss(`Кроссворд: «${p.c}» — подсмотрел ответ «${p.w}»`);solved.add(k);o.remove();draw()};
  });
 }
 draw();
}

  t.questions.forEach((x,qi)=>{const key=`${st.id}:${ti}:${qi}`;QKEY.set(x,{key,type:t.type,quest:q.id});QBYKEY.set(key,{obj:x,type:t.type,quest:q.id})})}))});
}

function srsAdd(obj){const i=QKEY.get(obj);if(!i)return;save.srs=save.srs||{};save.srs[i.key]={b:0,due:Date.now()};persist()}
function srsAnswer(obj,ok){
 const i=QKEY.get(obj);if(!i||!save.srs||!save.srs[i.key])return;const s=save.srs[i.key];
 if(ok){s.b++;if(s.b>=4){delete save.srs[i.key];save.learned=(save.learned||0)+1}else s.due=Date.now()+[0,1,3,7][s.b]*DAY}
 else{s.b=0;s.due=Date.now()}
 persist();
}

function groupTasks(list){return QTYPES.map(t=>({type:t,prompt:TLABEL[t],questions:list.filter(x=>x.type===t).map(x=>x.obj)})).filter(t=>t.questions.length)}

/* ================= ВОПРОС ДНЯ ================= */
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
function genDaily(){
 const seed=dayKey(),r=rng(seed);
 let pool=[...QBYKEY.values()].filter(x=>questStars(QUESTS[x.quest])>0&&!QUESTS[x.quest].bonus);
 if(pool.length<10)pool=[...QBYKEY.values()].filter(x=>!QUESTS[x.quest].bonus);
 pool.sort((a,b)=>(QKEY.get(a.obj).key<QKEY.get(b.obj).key?-1:1));
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 return groupTasks(pool.slice(0,7));
}
const dailyDone=()=>save.daily&&save.daily.last===dayKey();
function streakNow(){const d=save.daily;if(!d)return 0;const y=dayKey(Date.now()-DAY);return d.last===dayKey()||d.last===y?d.streak:0}
function dailyComplete(){
 const d=save.daily||{streak:0,best:0,last:0},t=dayKey(),y=dayKey(Date.now()-DAY);
 if(d.last===t)return false;
 d.streak=d.last===y?d.streak+1:1;d.best=Math.max(d.best||0,d.streak);d.last=t;save.daily=d;persist();return true;
}

function exportData(){return {app:'pvsz',v:1,build:BUILD,ts:Date.now(),save,log:LOG}}
async function packCode(){
 const json=JSON.stringify(exportData());
 const toB64=bytes=>{let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
 try{if(window.CompressionStream){const st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));return 'PVSZ1:'+toB64(new Uint8Array(await new Response(st).arrayBuffer()))}}catch(e){}
 return 'PVSZ0:'+toB64(new TextEncoder().encode(json));
}
async function unpackCode(code){
 code=code.trim().replace(/\s/g,'');const m=code.match(/^PVSZ([01]):(.+)$/);if(!m)throw new Error('Это не код прогресса');
 const b=m[2].replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b+'==='.slice((b.length+3)%4));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if(m[1]==='1'){if(!window.DecompressionStream)throw new Error('Этот браузер не умеет распаковывать код — используй файл');const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text())}
 return JSON.parse(new TextDecoder().decode(bytes));
}
